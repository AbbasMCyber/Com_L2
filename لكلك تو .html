  <script>
(function() {
  'use strict';

  const DATA = window.__LECTURE_DATA__;
  const STORAGE_KEY = 'zahraa_os_lec2_v1';

  /* ==================== Safe Storage ==================== */
  function loadState() {
    const def = {
      theme: 'light',
      fontScale: 1,
      reducedMotion: false,
      autoTranslate: false,
      focusMode: false,
      readingMode: false,
      lastUnit: 1,
      completedUnits: [],
      favorites: [],
      mistakes: [], // {key, unitId, unitTitle, q, options, ans, exp}
      paraScores: {}
    };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return def;
      return Object.assign(def, JSON.parse(raw));
    } catch (e) {
      return def;
    }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = loadState();
  let currentRoute = { view: 'home', unitId: 1 };
  let isTransitioning = false;
  let activeQuizState = {};
  let unitQuizSession = null;
  let finalExamSession = null;

  /* ==================== Motion Engine ==================== */
  const TRANSITIONS = [
    'trans-depth-zoom',
    'trans-flip-3d',
    'trans-drop-reveal',
    'trans-cinematic-push',
    'trans-perspective-tunnel',
    'trans-circular-reveal',
    'trans-directional-wipe',
    'trans-layered-dissolve',
    'trans-blur-focus',
    'trans-portal'
  ];

  const ROUTE_TRANSITION_MAP = {
    home: 'trans-depth-zoom',
    glossary: 'trans-circular-reveal',
    favorites: 'trans-flip-3d',
    mistakes: 'trans-drop-reveal',
    review: 'trans-portal',
    exam: 'trans-perspective-tunnel'
  };

  function getReducedMotion() {
    return state.reducedMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applyTransition(el, routeKey, unitId) {
    TRANSITIONS.forEach(c => el.classList.remove(c));
    if (getReducedMotion()) return;
    let cls = ROUTE_TRANSITION_MAP[routeKey];
    if (!cls) {
      const unitTransitions = ['trans-directional-wipe', 'trans-cinematic-push', 'trans-blur-focus', 'trans-layered-dissolve', 'trans-depth-zoom'];
      cls = unitTransitions[(unitId || 0) % unitTransitions.length];
    }
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function spawnRipple(btn, ev) {
    if (getReducedMotion()) return;
    const rect = btn.getBoundingClientRect();
    const wave = document.createElement('span');
    wave.className = 'ripple-wave';
    const size = Math.max(rect.width, rect.height);
    wave.style.width = wave.style.height = size + 'px';
    const x = (ev.clientX || (rect.left + rect.width / 2)) - rect.left - size / 2;
    const y = (ev.clientY || (rect.top + rect.height / 2)) - rect.top - size / 2;
    wave.style.left = x + 'px';
    wave.style.top = y + 'px';
    btn.appendChild(wave);
    setTimeout(() => wave.remove(), 560);
  }

  function particleBurst(x, y, colors) {
    if (getReducedMotion()) return;
    const palette = colors || ['#0f4c81', '#0d9488', '#38bdf8', '#fbbf24'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('span');
      p.className = 'fx-particle';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = palette[i % palette.length];
      document.body.appendChild(p);
      const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.3);
      const dist = 36 + Math.random() * 52;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      if (p.animate) {
        const anim = p.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(0.2)`, opacity: 0 }
        ], { duration: 540, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
        anim.onfinish = () => p.remove();
      } else {
        p.remove();
      }
    }
  }

  let revealObserver = null;
  function initScrollReveals() {
    const items = document.querySelectorAll('.reveal-item');
    if (getReducedMotion() || !('IntersectionObserver' in window)) {
      items.forEach(el => el.classList.add('revealed'));
      return;
    }
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry, idx) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('revealed'), Math.min(idx * 55, 220));
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    items.forEach(el => revealObserver.observe(el));
  }

  function bindInteractiveTilt() {
    if (getReducedMotion() || !(window.matchMedia && window.matchMedia('(pointer: fine)').matches)) return;
    document.querySelectorAll('.card-3d, .btn-magnetic').forEach(el => {
      if (el.dataset.tiltBound) return;
      el.dataset.tiltBound = '1';
      el.addEventListener('pointermove', (e) => {
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        if (el.classList.contains('btn-magnetic')) {
          el.style.transform = `translate(${px * 6}px, ${py * 5}px)`;
        } else {
          el.style.transform = `perspective(900px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 4).toFixed(2)}deg) translateY(-2px)`;
        }
      });
      el.addEventListener('pointerleave', () => {
        el.style.transform = '';
      });
    });
  }

  /* ==================== Toast & Clipboard ==================== */
  function showToast(msg) {
    const wrap = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      t.style.transition = 'opacity 220ms, transform 220ms';
      setTimeout(() => t.remove(), 240);
    }, 2600);
  }

  function copyText(text, btnEl) {
    const onDone = () => {
      showToast('تم نسخ النص بنجاح');
      if (btnEl) {
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path class="icon-check-path" d="M5 13l4 4L19 7"/></svg><span>تم النسخ</span>`;
        setTimeout(() => { btnEl.innerHTML = orig; }, 1400);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
    } else {
      fallbackCopy(text, onDone);
    }
  }
  function fallbackCopy(text, cb) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      cb();
    } catch (e) {
      showToast('تعذر النسخ التلقائي — يمكنك التحديد والنسخ يدوياً');
    }
  }

  /* ==================== Text Processing: Highlight Terms + Clickable Words ==================== */
  const sortedGlossary = [...DATA.glossary].sort((a, b) => b.term.length - a.term.length);
  const glossaryMap = new Map();
  DATA.glossary.forEach(g => glossaryMap.set(g.term.toLowerCase(), g));

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function wrapClickableWords(plain) {
    // Splits into words and punctuation while preserving spacing
    return plain.replace(/[A-Za-z][A-Za-z0-9'-]*/g, (word) => {
      return `<span class="click-word" data-word="${escapeHtml(word)}">${escapeHtml(word)}</span>`;
    });
  }

  function formatEnglishText(text) {
    // Match glossary terms first (case-insensitive whole-word), then wrap remaining words
    const escapedTerms = sortedGlossary.map(g => g.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const regex = new RegExp(`\\b(${escapedTerms.join('|')})\\b`, 'gi');
    let out = '';
    let lastIdx = 0;
    let match;
    while ((match = regex.exec(text)) !== null) {
      if (match.index > lastIdx) {
        out += wrapClickableWords(text.slice(lastIdx, match.index));
      }
      const matched = match[0];
      const info = glossaryMap.get(matched.toLowerCase());
      const typeCls = info ? `term-${info.type}` : 'term-core';
      out += `<span class="term-hl ${typeCls}" data-term="${escapeHtml(info ? info.term : matched)}" title="اضغط لعرض الترجمة والشرح">${escapeHtml(matched)}</span>`;
      lastIdx = regex.lastIndex;
    }
    if (lastIdx < text.length) {
      out += wrapClickableWords(text.slice(lastIdx));
    }
    return out;
  }

  /* ==================== Click-to-Translate Popover ==================== */
  const popover = document.getElementById('wordPopover');

  function lookupLocalWord(raw) {
    const clean = raw.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '');
    if (!clean) return null;
    if (glossaryMap.has(clean)) {
      const g = glossaryMap.get(clean);
      return { word: g.term, ar: g.ar, desc: g.def, ex: g.example, isTerm: true, termObj: g };
    }
    if (DATA.wordDict[clean]) {
      const [ar, desc] = DATA.wordDict[clean];
      return { word: raw, ar, desc, ex: '', isTerm: false };
    }
    // Simple stem fallbacks (s, es, ed, ing)
    const stems = [
      clean.replace(/ies$/, 'y'),
      clean.replace(/es$/, ''),
      clean.replace(/s$/, ''),
      clean.replace(/ed$/, ''),
      clean.replace(/ing$/, ''),
      clean.replace(/ing$/, 'e')
    ];
    for (const s of stems) {
      if (s.length > 2 && DATA.wordDict[s]) {
        const [ar, desc] = DATA.wordDict[s];
        return { word: raw, ar, desc: desc + ` (الجذر: ${s})`, ex: '', isTerm: false };
      }
    }
    return null;
  }

  function showWordPopover(targetEl, rawWord, forcedTerm) {
    const sel = window.getSelection ? window.getSelection().toString().trim() : '';
    if (sel.length > 0) return; // Never block text selection/copying

    let info = null;
    if (forcedTerm && glossaryMap.has(forcedTerm.toLowerCase())) {
      const g = glossaryMap.get(forcedTerm.toLowerCase());
      info = { word: g.term, ar: g.ar, desc: g.def, ex: g.example, isTerm: true, termObj: g };
    } else {
      info = lookupLocalWord(rawWord);
    }

    const typeLabels = { core: 'مصطلح أساسي', tech: 'مصطلح تقني', def: 'تعريف', abbr: 'اختصار' };
    const isFav = info && info.isTerm && state.favorites.includes(info.termObj.term);

    if (info) {
      popover.innerHTML = `
        <div class="wp-head">
          <div>
            <div class="wp-word en-text">${escapeHtml(info.word)}</div>
            ${info.isTerm ? `<span class="pill pill-primary" style="margin-top:4px">${typeLabels[info.termObj.type] || 'مصطلح'}</span>` : ''}
          </div>
          <div style="display:flex;gap:6px">
            ${info.isTerm ? `<button class="btn btn-icon btn-sm" id="wpFavBtn" title="حفظ في المفضلة" aria-label="حفظ في المفضلة">${isFav ? '★' : '☆'}</button>` : ''}
            <button class="btn btn-icon btn-sm" id="wpCloseBtn" aria-label="إغلاق">✕</button>
          </div>
        </div>
        <div class="wp-ar">${escapeHtml(info.ar)}</div>
        <div class="wp-desc">${escapeHtml(info.desc)}</div>
        ${info.ex ? `<div class="wp-ex en-text"><strong>Example:</strong> ${escapeHtml(info.ex)}</div>` : ''}
      `;
    } else {
      popover.innerHTML = `
        <div class="wp-head">
          <div class="wp-word en-text">${escapeHtml(rawWord)}</div>
          <button class="btn btn-icon btn-sm" id="wpCloseBtn" aria-label="إغلاق">✕</button>
        </div>
        <div class="wp-desc" id="wpOnlineStatus">الكلمة غير مسجلة في القاموس المحلي للمحاضرة.</div>
        <div style="margin-top:10px">
          <button class="btn btn-soft btn-sm" id="wpOnlineBtn">محاولة الترجمة عبر الإنترنت</button>
        </div>
      `;
    }

    popover.classList.add('open');
    const rect = targetEl.getBoundingClientRect();
    const pw = popover.offsetWidth || 320;
    const ph = popover.offsetHeight || 160;
    let left = Math.min(Math.max(12, rect.left), window.innerWidth - pw - 12);
    let top = rect.bottom + 8;
    if (top + ph > window.innerHeight - 12) {
      top = Math.max(12, rect.top - ph - 8);
    }
    popover.style.left = left + 'px';
    popover.style.top = top + 'px';

    const closeBtn = document.getElementById('wpCloseBtn');
    if (closeBtn) closeBtn.addEventListener('click', () => popover.classList.remove('open'));

    const favBtn = document.getElementById('wpFavBtn');
    if (favBtn && info && info.isTerm) {
      favBtn.addEventListener('click', () => {
        toggleFavorite(info.termObj.term, favBtn);
        favBtn.textContent = state.favorites.includes(info.termObj.term) ? '★' : '☆';
      });
    }

    const onlineBtn = document.getElementById('wpOnlineBtn');
    if (onlineBtn) {
      onlineBtn.addEventListener('click', async () => {
        const statusEl = document.getElementById('wpOnlineStatus');
        statusEl.textContent = 'جارٍ البحث عن ترجمة...';
        onlineBtn.disabled = true;
        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(rawWord)}&langpair=en|ar`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const tr = data && data.responseData && data.responseData.translatedText;
          if (tr && tr.toLowerCase() !== rawWord.toLowerCase()) {
            statusEl.innerHTML = `<div class="wp-ar">${escapeHtml(tr)}</div><div style="font-size:0.75rem;color:var(--text-soft)">ترجمة خارجية اختيارية</div>`;
          } else {
            statusEl.textContent = 'تعذر الحصول على ترجمة دقيقة لهذه الكلمة حالياً.';
          }
        } catch (err) {
          statusEl.textContent = 'تعذر الاتصال بخدمة الترجمة الخارجية (الوضع غير المتصل). القاموس المحلي يعمل بكامل كفاءته.';
        }
      });
    }
  }

  }

  /* ==================== Mistake Tracking ==================== */
  function recordMistake(unitId, unitTitle, qObj) {
    const key = unitId + '::' + qObj.q;
    if (!state.mistakes.some(m => m.key === key)) {
      state.mistakes.push({
        key,
        unitId,
        unitTitle,
        q: qObj.q,
        options: qObj.options,
        ans: qObj.ans,
        exp: qObj.exp
      });
      saveState();
      updateSidebarBadges();
    }
  }
  function clearMistake(key) {
    state.mistakes = state.mistakes.filter(m => m.key !== key);
    saveState();
    updateSidebarBadges();
  }

    document.getElementById('toggleAllArBtn').addEventListener('click', (e) => {
      spawnRipple(e.currentTarget, e);
      allArOpen = !allArOpen;
      container.querySelectorAll('.ar-box-wrap').forEach(el => el.classList.toggle('open', allArOpen));
      container.querySelectorAll('.toggle-ar-btn').forEach(b => {
        b.textContent = allArOpen ? '🙈 إخفاء الترجمة' : '🌐 ترجمة الفقرة';
      });
    });

    document.getElementById('markUnitDoneBtn').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      if (state.completedUnits.includes(unit.id)) {
        state.completedUnits = state.completedUnits.filter(id => id !== unit.id);
        showToast('تم إلغاء علامة إكمال الوحدة');
      } else {
        state.completedUnits.push(unit.id);
        showToast('أحسنت! تم تسجيل إكمال الوحدة ' + unit.id);
        particleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
      saveState();
      updateSidebarBadges();
      renderUnit(container, unit.id);
    });

    document.getElementById('shareUnitBtn').addEventListener('click', (e) => {
      const svg = e.currentTarget.querySelector('svg');
      if (svg) {
        svg.classList.remove('plane-launch');

      }

    });

    document.getElementById('startUnitQuizBtn').addEventListener('click', () => {
      const allQs = unit.paragraphs.flatMap(p => p.mcqs);
      const zone = document.getElementById('unitQuizZone');
      renderInteractiveQuiz(zone, allQs, {
        title: `اختبار الوحدة ${unit.id}: ${unit.title}`,
        unitId: unit.id,
        unitTitle: unit.title,
        key: 'unit_' + unit.id
      });
      zone.scrollIntoView({ behavior: getReducedMotion() ? 'auto' : 'smooth', block: 'center' });
    });

    if (prevUnit) document.getElementById('prevUnitBtn').addEventListener('click', () => navigate('unit', prevUnit.id));
    if (nextUnit) document.getElementById('nextUnitBtn').addEventListener('click', () => navigate('unit', nextUnit.id));
    const goRev = document.getElementById('goReviewBtn');
    if (goRev) goRev.addEventListener('click', () => navigate('review'));

    // Bind per-paragraph controls
    unit.paragraphs.forEach(p => {
      const arWrap = document.getElementById(`ar_${p.id}`);
      const arBtn = document.getElementById(`btn_ar_${p.id}`);
      if (arBtn && arWrap) {
        arBtn.addEventListener('click', () => {
          const open = arWrap.classList.toggle('open');
          arBtn.textContent = open ? '🙈 إخفاء الترجمة' : '🌐 ترجمة الفقرة';
        });
      }
      const cpEn = document.getElementById(`copy_en_${p.id}`);
      if (cpEn) cpEn.addEventListener('click', () => copyText(p.en, cpEn));
      const cpAr = document.getElementById(`copy_ar_${p.id}`);
      if (cpAr) cpAr.addEventListener('click', () => copyText(p.ar, cpAr));

      const mcqBtn = document.getElementById(`btn_mcq_${p.id}`);
      const mcqZone = document.getElementById(`mcq_${p.id}`);
      if (mcqBtn && mcqZone) {
        mcqBtn.addEventListener('click', (e) => {
          spawnRipple(e.currentTarget, e);
          if (mcqZone.dataset.open === '1') {
            mcqZone.innerHTML = '';

          } else {
            mcqZone.dataset.open = '1';
            renderInteractiveQuiz(mcqZone, p.mcqs, {
              title: 'Test Your Understanding — اختبر فهمك للفقرة',
              unitId: unit.id,
              unitTitle: unit.title,
              key: p.id
            });
          }
        });
      }
    });
  }

  /* ==================== Interactive MCQ Engine ==================== */
  function renderInteractiveQuiz(targetEl, questions, meta) {
    let idx = 0;
    let correct = 0;
    let wrong = 0;
    let answered = false;

    function drawQuestion() {
      if (idx >= questions.length) {
        const pct = Math.round((correct / questions.length) * 100);
        targetEl.innerHTML = `
          <div class="mcq-box">
            <div style="font-weight:900;font-size:1.05rem;color:var(--primary);margin-bottom:8px">نتيجة الاختبار — ${escapeHtml(meta.title)}</div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
              <span class="pill pill-primary">النسبة: ${pct}%</span>
              <span class="pill pill-success">صحيحة: ${correct}</span>
              <span class="pill" style="background:var(--danger-bg);color:var(--danger)">خاطئة: ${wrong}</span>
            </div>
            <button class="btn btn-sm btn-primary btn-spring" id="retry_${meta.key}">🔄 إعادة المحاولة</button>
          </div>`;
        if (pct >= 70) {
          const r = targetEl.getBoundingClientRect();
          particleBurst(r.left + r.width / 2, Math.max(80, r.top + 40));
        }
        document.getElementById(`retry_${meta.key}`).addEventListener('click', () => {
          idx = 0; correct = 0; wrong = 0; answered = false; drawQuestion();
        });
        return;
      }

      answered = false;
      const q = questions[idx];
      const letters = ['A', 'B', 'C', 'D'];
      targetEl.innerHTML = `
        <div class="mcq-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap">
            <span style="font-weight:800;font-size:0.86rem;color:var(--primary)">${escapeHtml(meta.title)}</span>
            <span class="pill">سؤال ${idx + 1} من ${questions.length}</span>
          </div>
          <div class="mcq-q en-text">${formatEnglishText(q.q)}</div>
          <div class="mcq-options">
            ${q.options.map((opt, i) => `
              <button class="mcq-opt" data-opt="${i}">
                <span class="pill" style="min-width:26px;justify-content:center">${letters[i]}</span>
                <span>${escapeHtml(opt)}</span>
              </button>`).join('')}
          </div>
          <div id="fb_${meta.key}"></div>
          <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.8rem;color:var(--text-soft)">اختر الإجابة ثم راجع التفسير</span>
            <button class="btn btn-sm btn-primary btn-spring" id="next_${meta.key}" style="display:none">${idx + 1 < questions.length ? 'السؤال التالي ←' : 'عرض النتيجة النهائية'}</button>
          </div>
        </div>
      `;

      const opts = targetEl.querySelectorAll('.mcq-opt');
      const fb = document.getElementById(`fb_${meta.key}`);
      const nextBtn = document.getElementById(`next_${meta.key}`);

      opts.forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered) return;
          answered = true;
          const chosen = Number(btn.dataset.opt);
          opts.forEach(b => b.disabled = true);
          opts[q.ans].classList.add('correct');
          if (chosen === q.ans) {
            correct++;
            fb.className = 'mcq-feedback ok';
            fb.innerHTML = `<strong>✓ إجابة صحيحة!</strong><div class="en-text" style="margin-top:4px">${escapeHtml(q.exp)}</div>`;
          } else {
            wrong++;
            btn.classList.add('wrong', 'shake-error');
            recordMistake(meta.unitId, meta.unitTitle, q);
            fb.className = 'mcq-feedback err';
            fb.innerHTML = `<strong>✕ إجابة غير صحيحة.</strong> الإجابة الصحيحة هي <strong>(${letters[q.ans]})</strong>.<div class="en-text" style="margin-top:4px">${escapeHtml(q.exp)}</div>`;
          }
          nextBtn.style.display = 'inline-flex';
        });
      });

      nextBtn.addEventListener('click', () => { idx++; drawQuestion(); });
    }

    drawQuestion();
  }

  /* ==================== Glossary View ==================== */
  function renderGlossary(container) {
    const sorted = [...DATA.glossary].sort((a, b) => a.term.localeCompare(b.term));
    const typeLabels = { all: 'الكل', core: 'أساسي', tech: 'تقني', def: 'تعريف', abbr: 'اختصار' };
    let activeType = 'all';
    let query = '';

    container.innerHTML = `
      <div class="card reveal-item" style="margin-bottom:20px">
        <h1 style="margin:0 0 6px;font-size:1.5rem">Glossary | قاموس المصطلحات</h1>
        <p style="margin:0 0 14px;color:var(--text-muted)">جميع المصطلحات الأساسية والتقنية والتعريفات والاختصارات المستخرجة من المحاضرة مرتبة أبجدياً.</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input type="search" id="glossSearch" placeholder="ابحث عن مصطلح بالإنجليزية أو العربية..." style="flex:1;min-width:220px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
          <div style="display:flex;gap:6px;flex-wrap:wrap" id="glossFilters">
            ${Object.entries(typeLabels).map(([k, v]) => `<button class="btn btn-sm ${k === 'all' ? 'btn-primary' : ''}" data-type="${k}">${v}</button>`).join('')}
          </div>
        </div>
      </div>
      <div id="glossList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px"></div>
    `;

    function draw() {
      const list = document.getElementById('glossList');
      const q = query.trim().toLowerCase();
      const filtered = sorted.filter(g => {
        if (activeType !== 'all' && g.type !== activeType) return false;
        if (!q) return true;
        return g.term.toLowerCase().includes(q) || g.ar.includes(q) || g.def.includes(q);
      });
      if (!filtered.length) {
        list.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;color:var(--text-soft)">لا توجد مصطلحات مطابقة لبحثك.</div>`;
        return;
      }
      list.innerHTML = filtered.map(g => {
        const fav = state.favorites.includes(g.term);
        return `
          <div class="card card-3d" style="display:flex;flex-direction:column;justify-content:space-between;gap:10px">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <span class="term-hl term-${g.type} en-text" style="font-size:0.98rem">${escapeHtml(g.term)}</span>
                <button class="btn btn-icon btn-sm fav-gloss-btn" data-fav="${escapeHtml(g.term)}" title="حفظ في المفضلة">${fav ? '★' : '☆'}</button>
              </div>
              <div style="font-weight:800;color:var(--accent);margin-top:8px">${escapeHtml(g.ar)}</div>
              <div style="font-size:0.86rem;color:var(--text-muted);margin-top:4px">${escapeHtml(g.def)}</div>
            </div>
            <div class="en-text" style="font-size:0.78rem;background:var(--bg-subtle);padding:7px 10px;border-radius:8px;color:var(--text-soft)"><strong>Ex:</strong> ${escapeHtml(g.example)}</div>
          </div>`;
      }).join('');

      list.querySelectorAll('.fav-gloss-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          toggleFavorite(btn.dataset.fav, btn);
          btn.textContent = state.favorites.includes(btn.dataset.fav) ? '★' : '☆';
        });
      });
    }

    document.getElementById('glossSearch').addEventListener('input', (e) => { query = e.target.value; draw(); });
    document.querySelectorAll('#glossFilters [data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeType = btn.dataset.type;
        document.querySelectorAll('#glossFilters [data-type]').forEach(b => b.classList.remove('btn-primary'));
        btn.classList.add('btn-primary');
        draw();
      });
    });
    draw();
  }

  /* ==================== Comprehensive Final Exam ==================== */
  function renderExam(container) {
    // Collect a balanced comprehensive set of 24 questions across the entire lecture
    const pool = [];
    DATA.units.forEach(u => {
      u.paragraphs.forEach(p => {
        if (p.mcqs.length > 0) {
          pool.push(Object.assign({}, p.mcqs[0], { unitId: u.id, unitTitle: u.title }));
        }
      });
    });
    const examQuestions = pool.slice(0, 25);

    let idx = 0;
    let correct = 0;
    let wrong = 0;
    let weakUnits = new Map();
    let answered = false;

    function draw() {
      if (idx >= examQuestions.length) {
        const pct = Math.round((correct / examQuestions.length) * 100);
        const weakArr = [...weakUnits.entries()];
        container.innerHTML = `
          <div class="card reveal-item" style="text-align:center;padding:30px">
            <h1 style="margin:0 0 8px;color:var(--primary)">🏆 نتائج الاختبار الشامل للمحاضرة الثانية</h1>
            <div style="font-size:2.6rem;font-weight:900;color:${pct >= 70 ? 'var(--success)' : 'var(--gold)'};margin:12px 0">${pct}%</div>
            <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px">
              <span class="pill pill-primary">الدرجة النهائية: ${correct} / ${examQuestions.length}</span>
              <span class="pill pill-success">الإجابات الصحيحة: ${correct}</span>
              <span class="pill" style="background:var(--danger-bg);color:var(--danger)">الإجابات الخاطئة: ${wrong}</span>
            </div>
            ${weakArr.length > 0 ? `
              <div style="text-align:right;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
                <div style="font-weight:800;margin-bottom:10px;color:var(--danger)">الموضوعات التي تحتاج إلى مراجعة:</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  ${weakArr.map(([uid, utitle]) => `<button class="btn btn-sm btn-soft" data-rev-unit="${uid}">الوحدة ${uid}: ${escapeHtml(utitle)}</button>`).join('')}
                </div>
              </div>
            ` : `<p style="color:var(--success);font-weight:800">أداء ممتاز! أتقنت جميع موضوعات المحاضرة دون أخطاء.</p>`}
            <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
              <button class="btn btn-primary btn-spring" id="restartExamBtn">🔄 إعادة الاختبار الشامل</button>
              <button class="btn btn-soft" id="examToMistakesBtn">🎯 مراجعة الأخطاء (${state.mistakes.length})</button>
            </div>
          </div>`;
        if (pct >= 70) particleBurst(window.innerWidth / 2, 220);
        document.getElementById('restartExamBtn').addEventListener('click', () => renderExam(container));
        document.getElementById('examToMistakesBtn').addEventListener('click', () => navigate('mistakes'));
        container.querySelectorAll('[data-rev-unit]').forEach(b => b.addEventListener('click', () => navigate('unit', Number(b.dataset.revUnit))));
        return;
      }

      answered = false;
      const q = examQuestions[idx];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = Math.round((idx / examQuestions.length) * 100);
      container.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
            <div>
              <h1 style="margin:0;font-size:1.3rem;color:var(--primary)">🏆 الاختبار الشامل للمحاضرة الثانية</h1>
              <span class="pill" style="margin-top:6px">الوحدة ${q.unitId}: ${escapeHtml(q.unitTitle)}</span>
            </div>
            <span class="pill pill-primary">سؤال ${idx + 1} من ${examQuestions.length}</span>
          </div>
          <div class="progress-track" style="background:var(--bg-subtle);margin-bottom:18px">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="mcq-q en-text" style="font-size:1.05rem">${formatEnglishText(q.q)}</div>
          <div>
            ${q.options.map((opt, i) => `
              <button class="mcq-opt" data-eopt="${i}">
                <span class="pill" style="min-width:26px;justify-content:center">${letters[i]}</span>
                <span>${escapeHtml(opt)}</span>
              </button>`).join('')}
          </div>
          <div id="examFb"></div>
          <div style="margin-top:16px;display:flex;justify-content:flex-end">
            <button class="btn btn-primary btn-spring" id="examNextBtn" style="display:none">${idx + 1 < examQuestions.length ? 'السؤال التالي ←' : 'إنهاء وعرض النتائج'}</button>
          </div>
        </div>
      `;

      const opts = container.querySelectorAll('[data-eopt]');
      const fb = document.getElementById('examFb');
      const nextBtn = document.getElementById('examNextBtn');
      opts.forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered) return;
          answered = true;
          const chosen = Number(btn.dataset.eopt);
          opts.forEach(b => b.disabled = true);
          opts[q.ans].classList.add('correct');
          if (chosen === q.ans) {
            correct++;
            fb.className = 'mcq-feedback ok';
            fb.innerHTML = `<strong>✓ إجابة صحيحة!</strong><div class="en-text" style="margin-top:4px">${escapeHtml(q.exp)}</div>`;
          } else {
            wrong++;
            weakUnits.set(q.unitId, q.unitTitle);
            recordMistake(q.unitId, q.unitTitle, q);
            btn.classList.add('wrong', 'shake-error');
            fb.className = 'mcq-feedback err';
            fb.innerHTML = `<strong>✕ إجابة خاطئة.</strong> الإجابة الصحيحة هي <strong>(${letters[q.ans]})</strong>.<div class="en-text" style="margin-top:4px">${escapeHtml(q.exp)}</div>`;
          }
          nextBtn.style.display = 'inline-flex';
        });
      });
      nextBtn.addEventListener('click', () => { idx++; draw(); });
    }

    draw();
  }

  /* ==================== Router (Hash-Safe, Zero Reload) ==================== */
  function navigate(view, unitId, pushHash = true) {
    popover.classList.remove('open');
    currentRoute = { view, unitId: unitId || state.lastUnit || 1 };
    if (pushHash) {
      const targetHash = view === 'unit' ? `#unit/${currentRoute.unitId}` : `#${view}`;
      if (window.location.hash !== targetHash) {
        try { window.location.hash = targetHash; } catch (e) {}
      }
    }
    renderCurrentView();
  }

  function renderCurrentView() {
    const container = document.getElementById('viewContainer');
    if (currentRoute.view === 'home') renderHome(container);
    else if (currentRoute.view === 'unit') renderUnit(container, currentRoute.unitId);
    else if (currentRoute.view === 'glossary') renderGlossary(container);
    else if (currentRoute.view === 'favorites') renderFavorites(container);
    else if (currentRoute.view === 'mistakes') renderMistakes(container);
    else if (currentRoute.view === 'review') renderReview(container);
    else if (currentRoute.view === 'exam') renderExam(container);
    else renderHome(container);

    highlightActiveNav();
    applyTransition(container, currentRoute.view, currentRoute.unitId);
    window.scrollTo({ top: 0, behavior: 'auto' });
    initScrollReveals();
    bindInteractiveTilt();
  }

  function parseHash() {
    const h = (window.location.hash || '#home').replace(/^#/, '');
    if (h.startsWith('unit/')) {
      const id = Number(h.split('/')[1]);
      if (id >= 1 && id <= DATA.units.length) return { view: 'unit', unitId: id };
    }
    if (['home', 'glossary', 'favorites', 'mistakes', 'review', 'exam'].includes(h)) {
      return { view: h, unitId: state.lastUnit };
    }
    return { view: 'home', unitId: state.lastUnit };
  }

  /* ==================== Global Search ==================== */
  function initSearch() {
    const input = document.getElementById('globalSearchInput');
    const dropdown = document.getElementById('searchDropdown');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      if (q.length < 2) {
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
        return;
      }
      const results = [];
      DATA.units.forEach(u => {
        if (u.title.toLowerCase().includes(q) || u.arTitle.includes(q)) {
          results.push({ type: 'unit', unitId: u.id, title: `الوحدة ${u.id}: ${u.title}`, snippet: u.arTitle });
        }
        u.paragraphs.forEach(p => {
          if (p.en.toLowerCase().includes(q) || p.ar.includes(q)) {
            results.push({ type: 'unit', unitId: u.id, title: `الوحدة ${u.id} — ${p.subtitle}`, snippet: p.en.slice(0, 95) + '...' });
          }
        });
      });
      DATA.glossary.forEach(g => {
        if (g.term.toLowerCase().includes(q) || g.ar.includes(q)) {
          results.push({ type: 'glossary', title: `مصطلح: ${g.term} (${g.ar})`, snippet: g.def.slice(0, 80) + '...' });
        }
      });

      const top = results.slice(0, 8);
      if (!top.length) {
        dropdown.innerHTML = `<div style="padding:12px;font-size:0.84rem;color:var(--text-soft)">لا توجد نتائج مطابقة لـ "${escapeHtml(input.value)}"</div>`;
      } else {
        dropdown.innerHTML = top.map((r, i) => `
          <button class="search-item" data-sr="${i}">
            <div class="search-item-title">${escapeHtml(r.title)}</div>
            <div class="search-item-snippet">${escapeHtml(r.snippet)}</div>
          </button>`).join('');
        dropdown.querySelectorAll('[data-sr]').forEach(btn => {
          btn.addEventListener('click', () => {
            const item = top[Number(btn.dataset.sr)];
            dropdown.classList.remove('open');
            input.value = '';
            if (item.type === 'unit') navigate('unit', item.unitId);
            else navigate('glossary');
          });
        });
      }
      dropdown.classList.add('open');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.topbar-search')) dropdown.classList.remove('open');
    });
  }

        <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between;align-items:center">
          <button class="btn btn-sm" style="color:var(--danger)" id="resetProgressBtn">إعادة ضبط التقدم المحفوظ</button>
          <button class="btn btn-sm btn-primary" id="closeSettingsDoneBtn">تم</button>
        </div>
      </div>
    `;
    modal.classList.add('open');

    body.querySelectorAll('[data-fscale]').forEach(b => {
      b.addEventListener('click', () => {
        state.fontScale = Number(b.dataset.fscale);
        saveState();
        applyVisualPrefs();
        openSettingsModal();
      });
    });
    document.getElementById('optAutoAr').addEventListener('change', (e) => { state.autoTranslate = e.target.checked; saveState(); });
    document.getElementById('optFocus').addEventListener('change', (e) => { state.focusMode = e.target.checked; saveState(); applyVisualPrefs(); });
    document.getElementById('optReading').addEventListener('change', (e) => { state.readingMode = e.target.checked; saveState(); applyVisualPrefs(); });
    document.getElementById('optReduced').addEventListener('change', (e) => { state.reducedMotion = e.target.checked; saveState(); applyVisualPrefs(); });
    document.getElementById('resetProgressBtn').addEventListener('click', () => {
      state.completedUnits = [];
      state.mistakes = [];
      state.favorites = [];
      saveState();
      updateSidebarBadges();
      modal.classList.remove('open');
      showToast('تمت إعادة ضبط التقدم بنجاح');
      renderCurrentView();
    });
    document.getElementById('closeSettingsDoneBtn').addEventListener('click', () => modal.classList.remove('open'));
  }

  /* ==================== Mobile Sidebar ==================== */
  function openMobileSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarBackdrop').classList.add('open');
  }
  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('open');
  }

  /* ==================== Global Delegated Events ==================== */
  document.addEventListener('click', (e) => {
    const termEl = e.target.closest('.term-hl');
    if (termEl && termEl.dataset.term) {
      e.stopPropagation();
      showWordPopover(termEl, termEl.textContent, termEl.dataset.term);
      return;
    }
    const wordEl = e.target.closest('.click-word');
    if (wordEl && wordEl.dataset.word) {
      e.stopPropagation();
      showWordPopover(wordEl, wordEl.dataset.word, null);
      return;
    }
    if (!e.target.closest('#wordPopover')) {
      popover.classList.remove('open');
    }
  });

  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const max = Math.max(1, h.scrollHeight - h.clientHeight);
    const pct = Math.min(100, Math.round((window.scrollY / max) * 100));
    const bar = document.getElementById('scrollProgressBar');
    if (bar) bar.style.width = pct + '%';
  }, { passive: true });

  window.addEventListener('hashchange', () => {
    const parsed = parseHash();
    navigate(parsed.view, parsed.unitId, false);
  });

  /* ==================== Init ==================== */
  function init() {
    applyVisualPrefs();
    buildSidebar();
    initSearch();

    // Topbar controls
    document.getElementById('brandHomeBtn').addEventListener('click', () => navigate('home'));
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      if (sb.classList.contains('open')) closeMobileSidebar();
      else openMobileSidebar();
    });
    document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyVisualPrefs();
    });
    document.getElementById('focusToggleBtn').addEventListener('click', () => {
      state.focusMode = !state.focusMode;
      saveState();
      applyVisualPrefs();
      showToast(state.focusMode ? 'تم تفعيل وضع التركيز' : 'تم إيقاف وضع التركيز');
    });
    document.getElementById('readingToggleBtn').addEventListener('click', () => {
      state.readingMode = !state.readingMode;
      saveState();
      applyVisualPrefs();
      showToast(state.readingMode ? 'تم تفعيل وضع القراءة' : 'تم إيقاف وضع القراءة');
    });
    document.getElementById('settingsOpenBtn').addEventListener('click', openSettingsModal);
    document.getElementById('settingsCloseBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('open'));
    document.getElementById('settingsModal').addEventListener('click', (e) => {
      if (e.target.id === 'settingsModal') e.currentTarget.classList.remove('open');
    });

    // Short First-Visit Cinematic Intro (once per session)
    const intro = document.getElementById('introOverlay');
    let seenIntro = false;
    try { seenIntro = sessionStorage.getItem('zahraa_intro_seen') === '1'; } catch (e) {}
    const dismissIntro = () => {
      if (!intro) return;
      intro.classList.add('intro-hide');
      try { sessionStorage.setItem('zahraa_intro_seen', '1'); } catch (e) {}
      setTimeout(() => { intro.style.display = 'none'; }, 540);
    };
    if (seenIntro || getReducedMotion()) {
      intro.style.display = 'none';
    } else {
      document.getElementById('introEnterBtn').addEventListener('click', dismissIntro);
      document.getElementById('introSkipBtn').addEventListener('click', dismissIntro);
    }

    const initial = parseHash();
    navigate(initial.view, initial.unitId, false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
