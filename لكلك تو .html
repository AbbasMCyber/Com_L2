<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture 2: Operating System &amp; Graphical User Interface — AL-Zahraa College of Medicine</title>
  <style>
:root {
  /* Motion Tokens */
  --dur-fast: 180ms;
  --dur-med: 340ms;
  --dur-scene: 560ms;
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);

  /* Light Academic Theme */
  --bg: #f4f7fb;
  --bg-elevated: #ffffff;
  --bg-subtle: #eaf0f8;
  --bg-glass: rgba(255, 255, 255, 0.84);
  --text: #0f172a;
  --text-muted: #475569;
  --text-soft: #64748b;
  --border: #d8e2ef;
  --border-strong: #b8c9df;

  /* Academic Medical Brand Colors */
  --primary: #0f4c81;
  --primary-hover: #0a3861;
  --primary-soft: rgba(15, 76, 129, 0.1);
  --accent: #0d9488;
  --accent-soft: rgba(13, 148, 136, 0.12);
  --gold: #b45309;
  --gold-soft: rgba(180, 83, 9, 0.12);
  --purple: #6d28d9;
  --purple-soft: rgba(109, 40, 217, 0.12);
  --success: #15803d;
  --success-bg: #dcfce7;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;

  /* Term Highlight Colors */
  --hl-core-bg: rgba(15, 76, 129, 0.13);
  --hl-core-border: #0f4c81;
  --hl-tech-bg: rgba(13, 148, 136, 0.14);
  --hl-tech-border: #0d9488;
  --hl-def-bg: rgba(180, 83, 9, 0.14);
  --hl-def-border: #b45309;
  --hl-abbr-bg: rgba(109, 40, 217, 0.14);
  --hl-abbr-border: #6d28d9;

  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --font-scale: 1;
  --sidebar-w: 300px;
  --topbar-h: 68px;
}

[data-theme="dark"] {
  --bg: #0b1120;
  --bg-elevated: #111c33;
  --bg-subtle: #182644;
  --bg-glass: rgba(17, 28, 51, 0.86);
  --text: #f1f5f9;
  --text-muted: #cbd5e1;
  --text-soft: #94a3b8;
  --border: #233558;
  --border-strong: #344c7a;

  --primary: #38bdf8;
  --primary-hover: #7dd3fc;
  --primary-soft: rgba(56, 189, 248, 0.15);
  --accent: #2dd4bf;
  --accent-soft: rgba(45, 212, 191, 0.15);
  --gold: #fbbf24;
  --gold-soft: rgba(251, 191, 36, 0.15);
  --purple: #c084fc;
  --purple-soft: rgba(192, 132, 252, 0.16);
  --success: #4ade80;
  --success-bg: rgba(21, 128, 61, 0.25);
  --danger: #f87171;
  --danger-bg: rgba(185, 28, 28, 0.25);

  --hl-core-bg: rgba(56, 189, 248, 0.18);
  --hl-core-border: #38bdf8;
  --hl-tech-bg: rgba(45, 212, 191, 0.18);
  --hl-tech-border: #2dd4bf;
  --hl-def-bg: rgba(251, 191, 36, 0.18);
  --hl-def-border: #fbbf24;
  --hl-abbr-bg: rgba(192, 132, 252, 0.18);
  --hl-abbr-border: #c084fc;

  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
}

*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  font-size: calc(16px * var(--font-scale));
  overflow-x: hidden;
}
body {
  margin: 0;
  font-family: 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background var(--dur-med) var(--ease-smooth), color var(--dur-med) var(--ease-smooth);
}
.en-text, [dir="ltr"] {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  direction: ltr;
  unicode-bidi: isolate;
  text-align: left;
}

/* ================= Ambient Motion Layer ================= */
.ambient-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.18;
  will-change: transform;
  animation: ambientFloat 22s ease-in-out infinite alternate;
}
.ambient-orb.orb-1 {
  width: 420px; height: 420px;
  top: -120px; right: -80px;
  background: radial-gradient(circle, var(--primary), transparent 70%);
}
.ambient-orb.orb-2 {
  width: 360px; height: 360px;
  bottom: -100px; left: -80px;
  background: radial-gradient(circle, var(--accent), transparent 70%);
  animation-duration: 28s;
  animation-delay: -6s;
}
.ambient-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: 0.22;
}
@keyframes ambientFloat {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-24px, 28px, 0) scale(1.06); }
  100% { transform: translate3d(18px, -20px, 0) scale(0.96); }
}

/* ================= Scroll Progress Bar ================= */
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 1200;
  background: transparent;
  pointer-events: none;
}
.scroll-progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--accent), var(--purple));
  transition: width 80ms linear;
}

/* ================= Cinematic Intro Overlay ================= */
.intro-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: radial-gradient(circle at 30% 25%, #12335c, #071224 72%);
  color: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: opacity 520ms var(--ease-expo), transform 520ms var(--ease-expo);
}
.intro-overlay.intro-hide {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}
.intro-card {
  max-width: 680px;
  width: 100%;
  text-align: center;
  position: relative;
}
.intro-logos {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(18px) scale(0.9);
  animation: introPop 600ms var(--ease-spring) 120ms forwards;
}
.intro-logos img {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: #fff;
  padding: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
.intro-kicker {
  font-size: 0.92rem;
  letter-spacing: 0.08em;
  color: #7dd3fc;
  opacity: 0;
  animation: introFadeUp 500ms var(--ease-smooth) 340ms forwards;
}
.intro-title {
  text-align: center !important;
  font-size: clamp(1.5rem, 4vw, 2.35rem);
  font-weight: 800;
  margin: 12px 0 8px;
  line-height: 1.3;
  opacity: 0;
  animation: introFadeUp 560ms var(--ease-expo) 520ms forwards;
}
.intro-sub {
  color: #cbd5e1;
  font-size: 1rem;
  margin-bottom: 26px;
  opacity: 0;
  animation: introFadeUp 520ms var(--ease-smooth) 720ms forwards;
}
.intro-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  opacity: 0;
  animation: introFadeUp 480ms var(--ease-spring) 900ms forwards;
}
@keyframes introPop { to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes introFadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ================= Layout Shell ================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 900;
  height: var(--topbar-h);
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 12px;
}
.topbar-right, .topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: none;
  border: none;
  color: var(--text);
  padding: 4px 6px;
  border-radius: 10px;
  text-align: right;
}
.brand-mini img {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: #fff;
  padding: 2px;
  border: 1px solid var(--border);
}
.brand-mini-title {
  font-weight: 800;
  font-size: 0.92rem;
  line-height: 1.2;
}
.brand-mini-sub {
  font-size: 0.72rem;
  color: var(--text-soft);
}

.topbar-search {
  flex: 1;
  max-width: 340px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  padding: 8px 36px 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 0.88rem;
  outline: none;
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.topbar-search input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.topbar-search .search-icon {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-soft);
  pointer-events: none;
  transition: transform var(--dur-fast) var(--ease-spring), color var(--dur-fast);
}
.topbar-search:focus-within .search-icon {
  color: var(--primary);
  transform: translateY(-50%) scale(1.15) rotate(-8deg);
}
.search-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  left: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  max-height: 360px;
  overflow-y: auto;
  z-index: 1050;
  display: none;
  padding: 6px;
}
.search-dropdown.open { display: block; animation: popIn var(--dur-fast) var(--ease-smooth); }
.search-item {
  width: 100%;
  text-align: right;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  display: block;
  transition: background var(--dur-fast);
}
.search-item:hover { background: var(--bg-subtle); }
.search-item-title { font-weight: 700; font-size: 0.88rem; }
.search-item-snippet { font-size: 0.78rem; color: var(--text-soft); margin-top: 2px; }

.app-shell {
  position: relative;
  z-index: 1;
  display: flex;
  min-height: calc(100vh - var(--topbar-h));
}

/* ================= Sidebar Navigation ================= */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border);
  height: calc(100vh - var(--topbar-h));
  position: sticky;
  top: var(--topbar-h);
  overflow-y: auto;
  padding: 14px 12px 28px;
  transition: transform var(--dur-med) var(--ease-expo), opacity var(--dur-med);
}
.sidebar-section-label {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--text-soft);
  padding: 10px 10px 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.nav-link {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 11px;
  margin-bottom: 3px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 10px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  text-align: right;
  transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
}
.nav-link:hover {
  background: var(--bg-subtle);
  color: var(--text);
  transform: translateX(-3px);
}
.nav-link.active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 700;
}
.nav-badge {
  font-size: 0.72rem;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--text-soft);
  flex-shrink: 0;
}
.nav-link.completed .nav-badge {
  background: var(--success-bg);
  color: var(--success);
}
.nav-unit-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--bg-subtle);
  color: var(--primary);
  font-size: 0.74rem;
  font-weight: 800;
  margin-left: 6px;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.48);
  z-index: 940;
  backdrop-filter: blur(3px);
}
.sidebar-backdrop.open { display: block; }

/* ================= Main Content Stage ================= */
.main-stage {
  flex: 1;
  min-width: 0;
  padding: 24px clamp(14px, 3vw, 36px) 72px;
  perspective: 1200px;
}
.view-container {
  max-width: 960px;
  margin: 0 auto;
  transform-style: preserve-3d;
  will-change: transform, opacity;
}

/* Focus Mode & Reading Mode */
body.focus-mode .sidebar,
body.focus-mode .topbar-search,
body.focus-mode .ambient-bg {
  display: none !important;
}
body.focus-mode .view-container { max-width: 820px; }
body.reading-mode .para-actions,
body.reading-mode .mcq-trigger-wrap,
body.reading-mode .unit-quiz-banner,
body.reading-mode .quick-tools-strip {
  display: none !important;
}

/* ================= 10 Cinematic Page Transitions ================= */
.trans-depth-zoom { animation: depthZoom var(--dur-scene) var(--ease-expo) both; }
@keyframes depthZoom {
  from { opacity: 0; transform: scale(0.92) translateZ(-60px); }
  to { opacity: 1; transform: scale(1) translateZ(0); }
}
.trans-flip-3d { animation: flip3D var(--dur-scene) var(--ease-expo) both; transform-origin: center top; }
@keyframes flip3D {
  from { opacity: 0; transform: rotateX(-14deg) translateY(22px); }
  to { opacity: 1; transform: rotateX(0) translateY(0); }
}
.trans-drop-reveal { animation: dropReveal var(--dur-scene) var(--ease-smooth) both; }
@keyframes dropReveal {
  from { opacity: 0; transform: translateY(-28px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.trans-cinematic-push { animation: cinematicPush var(--dur-scene) var(--ease-expo) both; }
@keyframes cinematicPush {
  from { opacity: 0; transform: translate3d(-36px, 0, -40px) scale(0.96); }
  to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}
.trans-perspective-tunnel { animation: perspectiveTunnel var(--dur-scene) var(--ease-expo) both; }
@keyframes perspectiveTunnel {
  from { opacity: 0; transform: scale(1.06) translateZ(50px); filter: blur(4px); }
  to { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); }
}
.trans-circular-reveal { animation: circularReveal 600ms var(--ease-expo) both; }
@keyframes circularReveal {
  from { opacity: 0.2; clip-path: circle(12% at 50% 25%); }
  to { opacity: 1; clip-path: circle(140% at 50% 25%); }
}
.trans-directional-wipe { animation: directionalWipe var(--dur-scene) var(--ease-expo) both; }
@keyframes directionalWipe {
  from { opacity: 0; transform: translateX(34px); }
  to { opacity: 1; transform: translateX(0); }
}
.trans-layered-dissolve { animation: layeredDissolve var(--dur-scene) var(--ease-smooth) both; }
@keyframes layeredDissolve {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.trans-blur-focus { animation: blurFocus var(--dur-scene) var(--ease-smooth) both; }
@keyframes blurFocus {
  from { opacity: 0; filter: blur(8px); transform: translateY(10px); }
  to { opacity: 1; filter: blur(0); transform: translateY(0); }
}
.trans-portal { animation: portalIn 620ms var(--ease-spring) both; }
@keyframes portalIn {
  from { opacity: 0; transform: scale(0.88) rotateY(8deg); }
  to { opacity: 1; transform: scale(1) rotateY(0); }
}

/* ================= Button Motion Laboratory ================= */
.btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  user-select: none;
  transition: transform var(--dur-fast) var(--ease-spring),
              box-shadow var(--dur-fast) var(--ease-smooth),
              background var(--dur-fast),
              border-color var(--dur-fast);
}
.btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 8px 22px rgba(15, 76, 129, 0.25);
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0; left: -120%;
  width: 60%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.32), transparent);
  transform: skewX(-22deg);
  transition: left 520ms var(--ease-expo);
}
.btn-primary:hover::after { left: 150%; }
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(15, 76, 129, 0.34);
}
.btn-soft {
  background: var(--primary-soft);
  color: var(--primary);
  border-color: transparent;
}
.btn-soft:hover {
  background: var(--primary);
  color: #fff;
  transform: translateY(-2px);
}
.btn-icon {
  padding: 8px 10px;
  border-radius: 10px;
  min-width: 38px;
  min-height: 38px;
}
.btn-sm { padding: 7px 13px; font-size: 0.82rem; border-radius: 10px; }

/* Specialized Press Personalities */
.btn-spring:active { transform: scale(0.92); }
.btn-elastic:active { transform: scale(0.95, 0.9); }
.btn-depth:active { transform: translateY(2px) scale(0.97); box-shadow: var(--shadow-sm); }
.btn-glow:hover { box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 20px rgba(13,148,136,0.22); }

.ripple-wave {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.42);
  transform: scale(0);
  animation: rippleExpand 520ms var(--ease-expo) forwards;
  pointer-events: none;
}
@keyframes rippleExpand {
  to { transform: scale(4); opacity: 0; }
}

/* Animated SVG Icon Personalities */
.icon-svg { width: 18px; height: 18px; flex-shrink: 0; }
.icon-check-path {
  stroke-dasharray: 26;
  stroke-dashoffset: 26;
  animation: drawCheck 380ms var(--ease-expo) forwards;
}
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

.shake-error { animation: shakeX 360ms ease-in-out; }
@keyframes shakeX {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  45% { transform: translateX(6px); }
  70% { transform: translateX(-4px); }
}

.bookmark-pop { animation: bookmarkPop 360ms var(--ease-spring); }
@keyframes bookmarkPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.32) rotate(-8deg); }
  100% { transform: scale(1); }
}

.plane-launch { animation: planeFly 620ms var(--ease-expo); }
@keyframes planeFly {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  50% { transform: translate(14px, -12px) scale(0.85) rotate(-18deg); opacity: 0.4; }
  51% { transform: translate(-10px, 8px) scale(0.85); opacity: 0; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}

/* ================= Cards & 3D Depth ================= */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 22px;
  transition: transform var(--dur-med) var(--ease-smooth), box-shadow var(--dur-med) var(--ease-smooth), border-color var(--dur-fast);
}
.card-3d:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}

/* Hero Banner */
.hero-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0b2d52 0%, #0f4c81 55%, #0d7a73 100%);
  color: #ffffff;
  border: none;
  padding: clamp(24px, 4vw, 40px);
  border-radius: 22px;
  box-shadow: var(--shadow-lg);
  margin-bottom: 24px;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.hero-logos {
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-logos img {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #ffffff;
  padding: 3px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.22);
}
.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 700;
}
.hero-title {
  font-size: clamp(1.45rem, 3.4vw, 2.2rem);
  font-weight: 900;
  margin: 8px 0 6px;
  line-height: 1.25;
}
.hero-subtitle {
  color: rgba(255,255,255,0.88);
  font-size: 1rem;
  margin: 0 0 18px;
}
.hero-instructors {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.instructor-chip {
  font-size: 0.8rem;
  background: rgba(255,255,255,0.13);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 4px 12px;
  border-radius: 999px;
  color: #f8fafc;
}
.progress-wrap {
  background: rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.86rem;
  font-weight: 700;
  margin-bottom: 8px;
}
.progress-track {
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #38bdf8, #5eead4);
  transition: width 600ms var(--ease-expo);
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.hero-btn-white {
  background: #ffffff;
  color: #0b2d52;
  border: none;
}
.hero-btn-white:hover { background: #f1f5f9; transform: translateY(-2px); }
.hero-btn-glass {
  background: rgba(255,255,255,0.15);
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.3);
}
.hero-btn-glass:hover { background: rgba(255,255,255,0.24); transform: translateY(-2px); }

/* Stats & Unit Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-val { font-size: 1.55rem; font-weight: 900; color: var(--primary); }
.stat-label { font-size: 0.82rem; color: var(--text-soft); font-weight: 600; }

.units-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.unit-tile {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  text-align: right;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast), border-color var(--dur-fast);
}
.unit-tile:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary);
}
.unit-tile-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.unit-tile-num {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 3px 10px;
  border-radius: 999px;
}
.unit-tile-page {
  font-size: 0.75rem;
  color: var(--text-soft);
}

/* ================= Unit Study View & Paragraphs ================= */
.unit-header-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.unit-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--text-muted);
}
.pill-primary { background: var(--primary-soft); color: var(--primary); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
.pill-success { background: var(--success-bg); color: var(--success); }

.para-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.para-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.para-subtitle {
  font-weight: 800;
  font-size: 1.02rem;
  color: var(--primary);
}
.en-block {
  font-size: 1.06rem;
  line-height: 1.9;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
}
.click-word {
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 2px;
  transition: background 140ms, color 140ms;
}
.click-word:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

/* Term Highlights */
.term-hl {
  display: inline;
  padding: 1px 6px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: transform 140ms, filter 140ms;
}
.term-hl:hover { filter: brightness(0.95); }
.term-core { background: var(--hl-core-bg); border-bottom-color: var(--hl-core-border); color: var(--primary); }
.term-tech { background: var(--hl-tech-bg); border-bottom-color: var(--hl-tech-border); color: var(--accent); }
.term-def  { background: var(--hl-def-bg);  border-bottom-color: var(--hl-def-border);  color: var(--gold); }
.term-abbr { background: var(--hl-abbr-bg); border-bottom-color: var(--hl-abbr-border); color: var(--purple); }

.term-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  font-size: 0.78rem;
}

/* Smooth Arabic Translation Box */
.ar-box-wrap {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 360ms var(--ease-expo), opacity 280ms var(--ease-smooth), margin 280ms;
  margin-bottom: 0;
}
.ar-box-wrap.open {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-bottom: 14px;
}
.ar-box-inner { overflow: hidden; }
.ar-box {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-right: 4px solid var(--accent);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 0.98rem;
  line-height: 1.85;
  color: var(--text);
}
.ar-label {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 4px;
}

.para-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

/* Lecture Tables */
.data-table-wrap {
  width: 100%;
  overflow-x: auto;
  margin: 14px 0;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.data-table th, .data-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  text-align: start;
}
.data-table th {
  background: var(--bg-subtle);
  font-weight: 800;
  color: var(--primary);
}
.data-table tr:last-child td { border-bottom: none; }

/* ================= Per-Paragraph & Unit MCQ Widget ================= */
.mcq-box {
  margin-top: 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 14px;
  padding: 18px;
  animation: popIn 280ms var(--ease-smooth);
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.mcq-q {
  font-weight: 700;
  font-size: 0.98rem;
  margin-bottom: 12px;
}
.mcq-opt {
  width: 100%;
  text-align: left;
  direction: ltr;
  padding: 11px 14px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 0.92rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 150ms var(--ease-spring), border-color 150ms, background 150ms;
}
.mcq-opt:hover:not(:disabled) {
  border-color: var(--primary);
  transform: translateX(3px);
}
.mcq-opt:disabled { cursor: default; }
.mcq-opt.correct {
  background: var(--success-bg);
  border-color: var(--success);
  color: var(--success);
  font-weight: 700;
}
.mcq-opt.wrong {
  background: var(--danger-bg);
  border-color: var(--danger);
  color: var(--danger);
  font-weight: 700;
}
.mcq-feedback {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 0.88rem;
}
.mcq-feedback.ok { background: var(--success-bg); color: var(--success); }
.mcq-feedback.err { background: var(--danger-bg); color: var(--danger); }

/* ================= Floating Word Translation Popover ================= */
.word-popover {
  position: fixed;
  z-index: 1500;
  width: min(340px, calc(100vw - 24px));
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  padding: 16px;
  display: none;
}
.word-popover.open {
  display: block;
  animation: popIn 220ms var(--ease-spring);
}
.wp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.wp-word { font-weight: 900; font-size: 1.12rem; color: var(--primary); }
.wp-ar { font-weight: 800; font-size: 1.02rem; color: var(--accent); margin-bottom: 6px; }
.wp-desc { font-size: 0.86rem; color: var(--text-muted); line-height: 1.6; }
.wp-ex {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg-subtle);
  border-radius: 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* ================= 3D Flippable Flashcards (Favorites & Review) ================= */
.flash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.flip-card {
  perspective: 1000px;
  min-height: 195px;
  cursor: pointer;
}
.flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 195px;
  transform-style: preserve-3d;
  transition: transform 540ms var(--ease-expo);
}
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.flip-back {
  transform: rotateY(180deg);
  background: var(--bg-subtle);
  border-color: var(--primary);
}

/* ================= Modal & Toast ================= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1600;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal-panel {
  width: min(460px, 100%);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  box-shadow: var(--shadow-lg);
  animation: depthZoom 300ms var(--ease-expo);
}
.toast-container {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 1700;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 0.86rem;
  font-weight: 700;
  box-shadow: var(--shadow-md);
  animation: popIn 240ms var(--ease-spring);
}

/* ================= Scroll Reveal ================= */
.reveal-item {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 480ms var(--ease-smooth), transform 480ms var(--ease-expo);
}
.reveal-item.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* Particle Burst */
.fx-particle {
  position: fixed;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1900;
}

/* ================= Responsive ================= */
.mobile-menu-btn { display: none; }
@media (max-width: 960px) {
  .mobile-menu-btn { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: var(--topbar-h);
    right: 0;
    bottom: 0;
    z-index: 950;
    transform: translateX(105%);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .topbar-search { max-width: 200px; }
  .brand-mini-sub { display: none; }
}
@media (max-width: 600px) {
  .topbar-search { display: none; }
  .hero-logos img { width: 44px; height: 44px; }
  .para-card, .unit-header-card { padding: 16px; }
}

/* ================= Reduced Motion Accessibility ================= */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .ambient-orb { animation: none !important; }
  .reveal-item { opacity: 1 !important; transform: none !important; }
}
body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}
body.reduced-motion .reveal-item { opacity: 1 !important; transform: none !important; }
</style>

  <script>window.__LECTURE_DATA__ = {"meta": {"college": "AL-Zahraa College of Medicine", "university": "University of Basrah", "title": "Operating System & Graphical User Interface", "lectureNumber": "Lecture 2", "totalPages": 30, "moduleLeader": "Assist.Prof. Dr. Waleed AL-Hashimi", "instructors": ["Lecturer: Eman.Alasadi", "Assistant Lecturer: Hussein Hameed", "Assistant Lecturer: Hasan Nashea"]}, "glossary": [{"term": "Operating System", "ar": "نظام التشغيل", "type": "core", "def": "البرنامج الرئيسي الذي يدير جميع المكونات المادية والبرمجية في الحاسوب ويعمل كجسر بين المستخدم والتطبيقات والعتاد.", "example": "Windows, macOS, Linux, Android, iOS."}, {"term": "OS", "ar": "نظام التشغيل (اختصار)", "type": "abbr", "def": "اختصار لـ Operating System، وهو البرنامج الأساسي الذي يضمن حصول كل برنامج على الموارد التي يحتاجها.", "example": "Every computer has an OS."}, {"term": "Hardware", "ar": "المكونات المادية (العتاد)", "type": "core", "def": "الأجزاء الفيزيائية في الحاسوب مثل المعالج والذاكرة ولوحة المفاتيح والطابعة، والتي لا تفهم أوامر الإنسان مباشرة.", "example": "Keyboards, mice, displays, printers, and network cards."}, {"term": "Software", "ar": "البرمجيات", "type": "core", "def": "البرامج والتطبيقات التي تعمل على الحاسوب ويديرها نظام التشغيل.", "example": "Operating systems, web browsers, and Word processors."}, {"term": "Resource Management", "ar": "إدارة الموارد", "type": "def", "def": "وظيفة أساسية لنظام التشغيل تضمن توزيع الموارد المادية والبرمجية بكفاءة وعدالة وأمان بين جميع البرامج قيد التشغيل.", "example": "Allocating CPU time, memory space, devices, and storage."}, {"term": "CPU", "ar": "وحدة المعالجة المركزية (المعالج)", "type": "abbr", "def": "اختصار لـ Central Processing Unit، وهو المعالج الذي يدير نظام التشغيل وقته وجدولته بين العمليات.", "example": "The OS rapidly switches the CPU between running tasks."}, {"term": "Scheduling", "ar": "الجدولة", "type": "tech", "def": "تحديد العملية التي تعمل وتحصل على وقت المعالج في أي لحظة زمنية معينة.", "example": "Scheduling tiny time slices for YouTube, a download, and Word."}, {"term": "Multitasking", "ar": "تعدد المهام", "type": "tech", "def": "السماح بتشغيل عدة تطبيقات في وقت واحد دون تعارض عبر تبديل المعالج السريع بين المهام.", "example": "Watching YouTube, downloading a file, and typing in Word simultaneously."}, {"term": "Time Slices", "ar": "شرائح زمنية", "type": "tech", "def": "فترات زمنية صغيرة جداً يخصصها نظام التشغيل لكل عملية على المعالج لتبدو وكأنها تعمل معاً.", "example": "The OS schedules tiny time slices for each process."}, {"term": "Memory Management", "ar": "إدارة الذاكرة", "type": "core", "def": "تخصيص الذاكرة للبرامج ومنع التعارض بينها، واستخدام الذاكرة الافتراضية والتخزين المؤقت.", "example": "Allocating memory efficiently when opening multiple Windows apps."}, {"term": "Virtual Memory", "ar": "الذاكرة الافتراضية", "type": "tech", "def": "ذاكرة يستخدمها نظام التشغيل عندما تكون ذاكرة الوصول العشوائي الفيزيائية (RAM) غير كافية.", "example": "Used when physical RAM is insufficient."}, {"term": "RAM", "ar": "ذاكرة الوصول العشوائي", "type": "abbr", "def": "الذاكرة الفيزيائية الأساسية التي يخصصها نظام التشغيل للبرامج قيد التشغيل.", "example": "Uses virtual memory when physical RAM is insufficient."}, {"term": "Caching", "ar": "التخزين المؤقت (الكاش)", "type": "def", "def": "تخزين البيانات المستخدمة بشكل متكرر في موقع سريع الوصول ليتمكن النظام من استرجاعها بسرعة دون إعادة حسابها أو تحميلها من وحدة تخزين أبطأ.", "example": "Provides caching for faster access to frequently used data."}, {"term": "Device Management", "ar": "إدارة الأجهزة", "type": "core", "def": "التحكم بأجهزة الإدخال والإخراج ومشاركتها بأمان وكفاءة بين البرامج باستخدام مشغلات الأجهزة.", "example": "Managing a printer queue while coordinating CPU and memory usage."}, {"term": "Input/Output Devices", "ar": "أجهزة الإدخال والإخراج", "type": "core", "def": "الأجهزة المتصلة بالحاسوب لإدخال البيانات أو إخراجها مثل لوحة المفاتيح والفأرة والشاشة والطابعة وبطاقة الشبكة.", "example": "Keyboards, mice, displays, printers, and network cards."}, {"term": "Device Drivers", "ar": "مشغلات الأجهزة (التعريفات)", "type": "def", "def": "برامج صغيرة تسمح لنظام التشغيل بالتواصل مع الأجهزة المادية وترجمة الأوامر إليها.", "example": "Printer driver and Wi-Fi driver."}, {"term": "Device Driver", "ar": "مشغل الجهاز (التعريف)", "type": "def", "def": "برنامج صغير يسمح لنظام التشغيل بالتواصل مع جهاز مادي محدد؛ وبدونه قد لا يعمل الجهاز بشكل صحيح أو لا يعمل إطلاقاً.", "example": "A printer driver allows Windows or macOS to send documents to a printer."}, {"term": "Printer Queue", "ar": "طابور الطباعة", "type": "tech", "def": "قائمة انتظار مهام الطباعة التي يديرها نظام التشغيل لتنسيق استخدام الطابعة بين البرامج.", "example": "Managing a printer queue while coordinating CPU and memory usage."}, {"term": "File Organization", "ar": "تنظيم الملفات", "type": "tech", "def": "تخزين البيانات في ملفات ومجلدات (دلائل) لتسهيل الوصول إليها.", "example": "Storing a document in a specific folder on your hard drive."}, {"term": "Access Control", "ar": "التحكم في الوصول", "type": "tech", "def": "تعيين الأذونات والصلاحيات لحماية الملفات من الوصول أو التعديل غير المصرح به.", "example": "Ensuring only authorized users can access or modify a saved document."}, {"term": "Storage Allocation", "ar": "تخصيص التخزين", "type": "tech", "def": "تتبع المساحة المستخدمة والفارغة على وحدة التخزين لمنع تلف البيانات.", "example": "Tracks used and free space to prevent data corruption."}, {"term": "File Operations", "ar": "عمليات الملفات", "type": "tech", "def": "العمليات التي يدعمها نظام التشغيل على الملفات: الإنشاء، القراءة، الكتابة، النسخ، النقل، والحذف.", "example": "Creating, reading, writing, copying, moving, and deleting files."}, {"term": "Process", "ar": "العملية", "type": "def", "def": "برنامج في حالة تنفيذ؛ ويتولى نظام التشغيل إنشاء العمليات وجدولتها وإنهاءها.", "example": "Opening a web browser creates a process managed by the OS."}, {"term": "Process Management", "ar": "إدارة العمليات", "type": "core", "def": "مسؤولية نظام التشغيل عن إنشاء العمليات وجدولتها ومزامنتها وإنهائها وتحرير مواردها.", "example": "Creating a browser process, scheduling CPU, and freeing resources on close."}, {"term": "Process Creation and Termination", "ar": "إنشاء وإنهاء العمليات", "type": "tech", "def": "بدء تشغيل البرامج وتنظيف الموارد وتحريرها بعد انتهائها.", "example": "Closing a browser terminates its process and frees resources."}, {"term": "Process Scheduling", "ar": "جدولة العمليات", "type": "tech", "def": "تحديد أي عملية تحصل على وقت المعالج بناءً على الأولوية.", "example": "Decides which process gets CPU time based on priority."}, {"term": "Process Synchronization", "ar": "مزامنة العمليات", "type": "tech", "def": "ضمان عدم تعارض العمليات التي تتشارك في نفس الموارد.", "example": "Ensures processes that share resources don't conflict."}, {"term": "Printer Driver", "ar": "مشغل الطابعة", "type": "tech", "def": "برنامج تعريف يسمح لنظام Windows أو macOS بإرسال المستندات إلى طراز طابعة محدد.", "example": "Allows Windows or macOS to send documents to a specific printer model."}, {"term": "Wi-Fi Driver", "ar": "مشغل الواي فاي", "type": "tech", "def": "برنامج تعريف يمكّن الحاسوب من الاتصال بالشبكات اللاسلكية.", "example": "Enables the computer to connect to wireless networks."}, {"term": "Market Share", "ar": "الحصة السوقية", "type": "core", "def": "نسبة انتشار وشعبية نظام التشغيل في السوق العالمي مقارنة بالأنظمة الأخرى.", "example": "Windows is the dominant leader in the global desktop market."}, {"term": "Open-Source", "ar": "مفتوح المصدر", "type": "def", "def": "نظام يكون الكود الأساسي له مجانياً للاستخدام والتعديل والتوزيع.", "example": "Linux and the Android Open Source Project."}, {"term": "Distributions", "ar": "التوزيعات", "type": "tech", "def": "نكهات أو إصدارات متعددة من نظام Linux يركز كل منها على جانب معين مثل سهولة الاستخدام أو الأداء أو الخوادم.", "example": "Linux comes in many different 'flavors' or distributions."}, {"term": "Customizability", "ar": "قابلية التخصيص", "type": "tech", "def": "القدرة العالية على تعديل وتخصيص النظام والتحكم به، كما في Linux وAndroid.", "example": "Highly customizable and favored by developers and system administrators."}, {"term": "Web-based", "ar": "قائم على الويب", "type": "tech", "def": "نظام تشغيل تعتمد تطبيقاته أساساً على تطبيقات الويب وتُخزن ملفاته في السحابة.", "example": "Google Chrome OS is a web-based operating system."}, {"term": "Chromebooks", "ar": "أجهزة كروم بوك", "type": "tech", "def": "فئة من الحواسيب صُمم نظام ChromeOS خصيصاً لها وتنتجها شركات مثل Acer وASUS وDell وLenovo وGoogle.", "example": "Google Pixelbook and partner Chromebooks."}, {"term": "Ecosystem Integration", "ar": "تكامل المنظومة (النظام البيئي)", "type": "tech", "def": "التكامل السلس بين أجهزة وخدمات الشركة الواحدة مثل Mac وiPhone وiPad وApple Watch وAirDrop.", "example": "macOS and iOS seamlessly integrate across Apple devices."}, {"term": "Walled Garden", "ar": "الحديقة المسوّرة (البيئة المغلقة)", "type": "def", "def": "متجر تطبيقات خاضع لرقابة صارمة (مثل App Store في iOS) يضمن جودة التطبيقات وأمانها، لكنه يحد من حرية المستخدم مقارنة بـ Android.", "example": "iOS tightly controlled App Store."}, {"term": "Server Operating Systems", "ar": "أنظمة تشغيل الخوادم", "type": "core", "def": "أنظمة تعمل على حواسيب قوية لتقديم الخدمات (مواقع الويب، قواعد البيانات، الملفات) لحواسيب أخرى عبر الشبكة.", "example": "Windows Server and Linux Server."}, {"term": "Embedded Operating Systems", "ar": "أنظمة التشغيل المدمجة", "type": "core", "def": "أنظمة تشغيل خفيفة الوزن مصممة لأجهزة محددة.", "example": "Systems inside medical devices, car airbags, and industrial controllers."}, {"term": "RTOS", "ar": "أنظمة التشغيل بالوقت الحقيقي (اختصار)", "type": "abbr", "def": "اختصار لـ Real-Time Operating Systems، تُستخدم في الأنظمة الحرجة زمنياً مثل الوسائد الهوائية للسيارات والأجهزة الطبية ووحدات التحكم الصناعية.", "example": "Car airbags, medical devices, and industrial controllers."}, {"term": "Real-Time Operating Systems", "ar": "أنظمة التشغيل بالوقت الحقيقي", "type": "def", "def": "أنظمة تشغيل مصممة للاستجابة الفورية في الأنظمة الحرجة زمنياً.", "example": "Used in time-critical systems like car airbags and medical devices."}, {"term": "Virtualization", "ar": "المحاكاة الافتراضية", "type": "tech", "def": "تقنية تسمح بتشغيل نظام تشغيل آخر (مثل Windows أو Linux) على أجهزة Apple إلى جانب النظام الأساسي.", "example": "Apple hardware can support Windows and Linux through virtualization."}, {"term": "Dual-Boot", "ar": "الإقلاع المزدوج", "type": "tech", "def": "إعداد يتيح تثبيت أكثر من نظام تشغيل على نفس الجهاز واختيار النظام المطلوب عند التشغيل.", "example": "Running Windows and Linux on Apple hardware via dual-boot configurations."}, {"term": "User Interface", "ar": "واجهة المستخدم", "type": "def", "def": "مكون في نظام التشغيل يسمح للمستخدمين بالتفاعل مع الحاسوب وبرامجه وإعطاء الأوامر.", "example": "GUI and CLI are the two primary types of user interfaces."}, {"term": "UI", "ar": "واجهة المستخدم (اختصار)", "type": "abbr", "def": "اختصار لـ User Interface، الوسيلة التي يتفاعل بها المستخدم مع الجهاز.", "example": "Without a UI, users would not be able to give commands easily."}, {"term": "Command-Driven Interfaces", "ar": "الواجهات المعتمدة على الأوامر", "type": "tech", "def": "واجهات الحواسيب المبكرة (مثل MS-DOS) التي تطلبت كتابة أوامر دقيقة، وكانت قوية لكنها صعبة لمعظم الناس.", "example": "MS-DOS."}, {"term": "Menu-Driven Interfaces", "ar": "الواجهات المعتمدة على القوائم", "type": "tech", "def": "واجهات تتيح للمستخدم اختيار الأوامر من قوائم على الشاشة بدلاً من كتابتها؛ أسهل لكنها ليست بديهية جداً.", "example": "Early on-screen menu interfaces."}, {"term": "Graphical User Interface", "ar": "واجهة المستخدم الرسومية", "type": "def", "def": "طريقة بصرية للتفاعل مع الحاسوب باستخدام الأيقونات والأزرار والقوائم والنوافذ وحركات التأشير والنقر بدلاً من كتابة الأوامر.", "example": "Windows and macOS desktop interfaces."}, {"term": "GUI", "ar": "واجهة المستخدم الرسومية (اختصار)", "type": "abbr", "def": "اختصار لـ Graphical U
