الرسومية. مسؤول المادة: أ.م.د. وليد الهاشمي. الكادر التدريسي: م. إيمان الأسدي، م.م. حسين حميد، وم.م. حسن ناشع.", "mcqs": [{"q": "Which institution delivers Lecture 2 on Operating System & Graphical User Interface?", "options": ["AL-Zahraa College of Medicine, University of Basrah", "College of Computer Science, University of Baghdad", "College of Engineering, University of Basrah", "College of Pharmacy, University of Mosul"], "ans": 0, "exp": "Slide 1 explicitly states the lecture is presented by AL-Zahraa College of Medicine, University of Basrah."}]}, {"id": "u1p2", "subtitle": "Learning Objectives", "page": "2", "en": "By the end of this lecture, you should be able to: Define an operating system and explain its essential role; Describe key OS resource management functions (CPU, memory, devices, storage, processes); Identify and compare common desktop, mobile, and server operating systems; Understand factors in choosing an operating system; Differentiate between GUI and CLI interfaces; Demonstrate proper mouse techniques for GUI interaction.", "ar": "في نهاية هذه المحاضرة، ينبغي أن تكون قادراً على: تعريف نظام التشغيل وشرح دوره الأساسي؛ وصف وظائف إدارة الموارد الرئيسية لنظام التشغيل (المعالج، الذاكرة، الأجهزة، التخزين، العمليات)؛ تحديد ومقارنة أنظمة التشغيل الشائعة لسطح المكتب والهواتف المحمولة والخوادم؛ فهم العوامل المؤثرة في اختيار نظام التشغيل؛ التمييز بين واجهتي GUI وCLI؛ وتطبيق تقنيات الفأرة الصحيحة للتفاعل مع الواجهة الرسومية GUI.", "mcqs": [{"q": "Which five key OS resource management functions are listed in the lecture objectives?", "options": ["CPU, memory, devices, storage, and processes", "Browsers, emails, printers, keyboards, and clouds", "Windows, macOS, Linux, Android, and iOS", "Pointing, clicking, dragging, scrolling, and hovering"], "ans": 0, "exp": "The second objective specifies the five key OS resource management functions: CPU, memory, devices, storage, and processes."}, {"q": "Which two user interfaces are students expected to differentiate between according to the objectives?", "options": ["RAM and CPU", "GUI and CLI", "RTOS and Dual-Boot", "Windows and ChromeOS"], "ans": 1, "exp": "The fifth objective states: Differentiate between GUI and CLI interfaces."}]}]}, {"id": 2, "title": "Operating System", "arTitle": "نظام التشغيل", "pages": "3", "category": "مفاهيم أساسية", "paragraphs": [{"id": "u2p1", "subtitle": "Ubiquity of Operating Systems", "page": "3", "en": "Every computer, from smartphones to supercomputers, has an operating system. Even game consoles, cars, and some appliances include an OS.", "ar": "يمتلك كل حاسوب، بدءاً من الهواتف الذكية وصولاً إلى الحواسيب الفائقة، نظام تشغيل. وحتى أجهزة ألعاب الفيديو والسيارات وبعض الأجهزة المنزلية تتضمن نظام تشغيل (OS).", "mcqs": [{"q": "According to the lecture, which of the following devices can include an operating system?", "options": ["Only desktop computers and laptops", "Smartphones, supercomputers, game consoles, cars, and some appliances", "Only smartphones and web servers", "Only devices with a keyboard and mouse"], "ans": 1, "exp": "Slide 3 states that every computer from smartphones to supercomputers has an OS, and even game consoles, cars, and some appliances include an OS."}]}, {"id": "u2p2", "subtitle": "Definition & Essential Role", "page": "3", "en": "An operating system is the main software that manages all hardware and software on a computer. It acts as a bridge between the user, applications, and the hardware. Without it, a computer cannot function because hardware does not understand human commands directly.", "ar": "نظام التشغيل هو البرنامج الرئيسي الذي يدير جميع المكونات المادية والبرمجية في الحاسوب، ويعمل كجسر يربط بين المستخدم والتطبيقات والمكونات المادية. وبدونه لا يستطيع الحاسوب العمل لأن المكونات المادية لا تفهم أوامر الإنسان مباشرة.", "mcqs": [{"q": "Why can a computer NOT function without an operating system?", "options": ["Because applications cannot be downloaded from the internet", "Because hardware does not understand human commands directly", "Because the mouse cannot connect to the monitor", "Because RAM is always full without an OS"], "ans": 1, "exp": "Slide 3 explains that without an OS, a computer cannot function because hardware does not understand human commands directly."}, {"q": "What does an operating system act as a bridge between?", "options": ["The user, applications, and the hardware", "Only the keyboard and the printer", "Windows and macOS", "The internet and the hard drive"], "ans": 0, "exp": "An operating system acts as a bridge between the user, applications, and the hardware."}]}, {"id": "u2p3", "subtitle": "Preventing Resource Crashes", "page": "3", "en": "The OS ensures that every program gets the resources it needs such as CPU time, memory space, and access to storage without crashing into other program.", "ar": "يضمن نظام التشغيل حصول كل برنامج على الموارد التي يحتاجها مثل وقت المعالج (CPU)، ومساحة الذاكرة، والوصول إلى التخزين دون أن يتعارض أو يتصادم مع برنامج آخر.", "mcqs": [{"q": "Which set of resources does the OS ensure every program gets without crashing into other programs?", "options": ["CPU time, memory space, and access to storage", "Wi-Fi passwords, cloud accounts, and web browsers", "Screen brightness, speaker volume, and battery percentage", "Textbooks, lecture slides, and mouse pads"], "ans": 0, "exp": "Slide 3 states that the OS ensures every program gets CPU time, memory space, and access to storage without crashing into another program."}]}]}, {"id": 3, "title": "Resource Management", "arTitle": "إدارة الموارد", "pages": "4", "category": "إدارة الموارد", "paragraphs": [{"id": "u3p1", "subtitle": "Importance of the OS in Managing Hardware and Software Resources", "page": "4", "en": "Resource management is a core function of an operating system (OS). It ensures that hardware and software resources are allocated efficiently, fairly, and safely among all running programs.", "ar": "تُعد إدارة الموارد وظيفة جوهرية لنظام التشغيل (OS)، إذ تضمن توزيع الموارد المادية والبرمجية بكفاءة وعدالة وأمان بين جميع البرامج قيد التشغيل.", "mcqs": [{"q": "How does resource management ensure hardware and software resources are allocated among running programs?", "options": ["Randomly and without limits", "Efficiently, fairly, and safely", "Exclusively to one program at a time", "Manually by the user via CLI"], "ans": 1, "exp": "Slide 4 defines resource management as ensuring hardware and software resources are allocated efficiently, fairly, and safely among all running programs."}]}]}, {"id": 4, "title": "CPU Management", "arTitle": "إدارة وحدة المعالجة المركزية (المعالج)", "pages": "4", "category": "إدارة الموارد", "paragraphs": [{"id": "u4p1", "subtitle": "A. CPU (Processor) Management — Scheduling & Multitasking", "page": "4", "en": "Key Roles of the OS in Resource Management — A. CPU (Processor) Management: Scheduling determines which process runs at any given time. Multitasking allows multiple applications to run simultaneously without conflict.", "ar": "الأدوار الرئيسية لنظام التشغيل في إدارة الموارد — أ. إدارة وحدة المعالجة المركزية (المعالج): تحدد الجدولة (Scheduling) أي عملية تعمل في أي وقت محدد، بينما يتيح تعدد المهام (Multitasking) تشغيل عدة تطبيقات في وقت واحد دون تعارض.", "mcqs": [{"q": "In CPU management, what is the role of Scheduling?", "options": ["Storing frequently used data in a fast-access location", "Determining which process runs at any given time", "Translating commands to a printer", "Setting file permissions for unauthorized users"], "ans": 1, "exp": "Scheduling determines which process runs at any given time."}, {"q": "What does Multitasking allow on a computer?", "options": ["Multiple applications to run simultaneously without conflict", "Connecting to wireless networks without drivers", "Running macOS on non-Apple hardware natively", "Deleting files using a trash can icon"], "ans": 0, "exp": "Multitasking allows multiple applications to run simultaneously without conflict."}]}, {"id": "u4p2", "subtitle": "Real-World Example of Multitasking", "page": "4", "en": "Example: When you are watching a YouTube video, downloading a file, and typing in Word at the same time, the operating system rapidly switches the CPU between these tasks. It schedules tiny time slices for each process so everything appears to run simultaneously; this is how multitasking works.", "ar": "مثال: عندما تشاهد فيديو على يوتيوب، وتنزّل ملفاً، وتكتب في برنامج Word في الوقت نفسه، يقوم نظام التشغيل بتبديل المعالج بسرعة فائقة بين هذه المهام، ويجدول شرائح زمنية ضئيلة لكل عملية بحيث يبدو كل شيء وكأنه يعمل بالتزامن؛ وهكذا يعمل تعدد المهام.", "mcqs": [{"q": "How does the OS make watching YouTube, downloading a file, and typing in Word appear to run simultaneously?", "options": ["By pausing Word until the YouTube video finishes", "By rapidly switching the CPU between tasks using tiny scheduled time slices", "By converting all three tasks into a single file", "By moving all tasks to the printer queue"], "ans": 1, "exp": "The OS rapidly switches the CPU between tasks and schedules tiny time slices for each process so everything appears to run simultaneously."}]}]}, {"id": 5, "title": "Memory Management", "arTitle": "إدارة الذاكرة", "pages": "5", "category": "إدارة الموارد", "paragraphs": [{"id": "u5p1", "subtitle": "B. Memory Management Functions & Example", "page": "5", "en": "Memory Management assigns memory to programs and prevents conflicts between them. It uses virtual memory when physical RAM is insufficient, and provides caching for faster access to frequently used data. Example: When opening multiple applications in Windows, the OS allocates memory efficiently to prevent crashes.", "ar": "تقوم إدارة الذاكرة بتخصيص الذاكرة للبرامج ومنع التعارض بينها، وتستخدم الذاكرة الافتراضية (Virtual Memory) عندما تكون ذاكرة الوصول العشوائي الفيزيائية (RAM) غير كافية، كما توفر التخزين المؤقت (Caching) للوصول الأسرع إلى البيانات المستخدمة بشكل متكرر. مثال: عند فتح عدة تطبيقات في نظام Windows، يخصص نظام التشغيل الذاكرة بكفاءة لمنع تعطل النظام.", "mcqs": [{"q": "When does the operating system use virtual memory?", "options": ["When the printer queue is full", "When physical RAM is insufficient", "When typing commands in a CLI", "When no applications are open"], "ans": 1, "exp": "Slide 5 states that Memory Management uses virtual memory when physical RAM is insufficient."}, {"q": "In the Windows example of Memory Management, why does the OS allocate memory efficiently when opening multiple applications?", "options": ["To prevent crashes", "To translate printer commands", "To increase screen brightness", "To format the hard drive"], "ans": 0, "exp": "Opening multiple applications in Windows requires the OS to allocate memory efficiently to prevent crashes."}]}, {"id": "u5p2", "subtitle": "Definition of Caching", "page": "5", "en": "Caching means: Storing frequently used data in a fast-access location so the system can retrieve it quickly without recalculating or reloading it from slower storage.", "ar": "التخزين المؤقت (Caching) يعني: تخزين البيانات المستخدمة بشكل متكرر في موقع سريع الوصول، بحيث يتمكن النظام من استرجاعها بسرعة دون إعادة حسابها أو إعادة تحميلها من وحدة تخزين أبطأ.", "mcqs": [{"q": "What is the exact definition of Caching given in the lecture?", "options": ["Deleting unused files from a folder automatically", "Storing frequently used data in a fast-access location for quick retrieval without recalculating or reloading from slower storage", "Switching the CPU rapidly between running programs", "Restricting unauthorized users from modifying documents"], "ans": 1, "exp": "Slide 5 defines caching as storing frequently used data in a fast-access location so the system can retrieve it quickly without recalculating or reloading it from slower storage."}]}]}, {"id": 6, "title": "Device Management", "arTitle": "إدارة الأجهزة", "pages": "6", "category": "إدارة الموارد", "paragraphs": [{"id": "u6p1", "subtitle": "C. Device Management Roles & Example", "page": "6", "en": "Device Management controls input/output devices such as keyboards, mice, displays, printers, and network cards. It uses device drivers (Refer to slide 9 for details) to communicate between software and hardware, and ensures multiple programs can safely and efficiently share devices. Example: Managing a printer queue while coordinating CPU and memory usage.", "ar": "تتحكم إدارة الأجهزة بأجهزة الإدخال والإخراج مثل لوحات المفاتيح والفأرات والشاشات والطابعات وبطاقات الشبكة، وتستخدم مشغلات الأجهزة (Device Drivers — راجع الشريحة 9 للتفاصيل) للتواصل بين البرمجيات والعتاد، وتضمن إمكانية مشاركة الأجهزة بأمان وكفاءة بين عدة برامج. مثال: إدارة طابور الطباعة مع تنسيق استخدام المعالج والذاكرة.", "mcqs": [{"q": "What does the OS use in Device Management to communicate between software and hardware?", "options": ["Virtual memory", "Device drivers", "Context menus", "Scroll wheels"], "ans": 1, "exp": "Slide 6 states that Device Management uses device drivers to communicate between software and hardware."}, {"q": "Which of the following is given as an example of Device Management?", "options": ["Managing a printer queue while coordinating CPU and memory usage", "Drawing a box around icons on the desktop", "Installing Chrome Browser on macOS", "Using Shift + Click to select files"], "ans": 0, "exp": "Slide 6 gives the example: Managing a printer queue while coordinating CPU and memory usage."}]}]}, {"id": 7, "title": "Storage and File System Management", "arTitle": "إدارة التخزين ونظام الملفات", "pages": "7", "category": "إدارة الموارد", "paragraphs": [{"id": "u7p1", "subtitle": "D. Core Storage & File System Functions", "page": "7", "en": "Storage and File System Management includes four main functions: File Organization stores data in files and directories for easy access. Access Control sets permissions to protect files from unauthorized access. Storage Allocation tracks used and free space to prevent data corruption. File Operations supports creating, reading, writing, copying, moving, and deleting files.", "ar": "تتضمن إدارة التخزين ونظام الملفات أربع وظائف رئيسية: تنظيم الملفات (File Organization) الذي يخزن البيانات في ملفات ومجلدات لتسهيل الوصول إليها؛ والتحكم في الوصول (Access Control) الذي يضع الصلاحيات لحماية الملفات من الوصول غير المصرح به؛ وتخصيص التخزين (Storage Allocation) الذي يتتبع المساحة المستخدمة والفارغة لمنع تلف البيانات؛ وعمليات الملفات (File Operations) التي تدعم إنشاء الملفات وقراءتها وكتابتها ونسخها ونقلها وحذفها.", "mcqs": [{"q": "Which function tracks used and free space to prevent data corruption?", "options": ["Access Control", "Storage Allocation", "Process Synchronization", "Multitasking"], "ans": 1, "exp": "Storage Allocation tracks used and free space to prevent data corruption."}, {"q": "What is the purpose of Access Control in file system management?", "options": ["Setting permissions to protect files from unauthorized access", "Switching CPU time slices between processes", "Storing frequently used data in cache", "Connecting the computer to Wi-Fi"], "ans": 0, "exp": "Access Control sets permissions to protect files from unauthorized access."}]}, {"id": "u7p2", "subtitle": "Practical Example in Windows", "page": "7", "en": "Examples: When you save a document in Windows, the OS stores it in a specific folder on your hard drive, keeps track of its location, and ensures that only authorized users can access or modify it. Later, when you open the document, the OS retrieves it quickly from the storage.", "ar": "أمثلة: عندما تحفظ مستنداً في نظام Windows، يخزّنه نظام التشغيل في مجلد محدد على القرص الصلب، ويتتبع موقعه، ويضمن أن المستخدمين المصرح لهم فقط يمكنهم الوصول إليه أو تعديله. ولاحقاً عند فتح المستند، يسترجعه نظام التشغيل بسرعة من وحدة التخزين.", "mcqs": [{"q": "When you save a document in Windows, what does the OS do according to the example?", "options": ["Stores it in a specific folder, tracks its location, restricts access to authorized users, and retrieves it quickly when opened", "Sends it directly to the printer queue without saving", "Deletes it automatically after closing Word", "Uploads it only to a Chromebook"], "ans": 0, "exp": "Slide 7 explains that the OS stores the document in a specific folder, tracks its location, enforces authorized access, and retrieves it quickly later."}]}]}, {"id": 8, "title": "Process Management", "arTitle": "إدارة العمليات", "pages": "8", "category": "إدارة الموارد", "paragraphs": [{"id": "u8p1", "subtitle": "E. Definition of a Process & Key Functions", "page": "8", "en": "A process is a program in execution. The OS is responsible for creating, scheduling, and terminating processes. Key Functions: 1. Process Creation and Termination: Starts programs and cleans up after they finish. 2. Process Scheduling: Decides which process gets CPU time based on priority. 3. Process Synchronization: Ensures processes that share resources don't conflict.", "ar": "العملية (Process) هي برنامج في حالة تنفيذ، ويتولى نظام التشغيل مسؤولية إنشاء العمليات وجدولتها وإنهائها. الوظائف الرئيسية: 1. إنشاء وإنهاء العمليات: بدء تشغيل البرامج وتنظيف الموارد بعد انتهائها. 2. جدولة العمليات: تحديد أي عملية تحصل على وقت المعالج بناءً على الأولوية. 3. مزامنة العمليات: ضمان عدم تعارض العمليات التي تتشارك الموارد.", "mcqs": [{"q": "How is a 'process' defined in the lecture?", "options": ["A hardware device attached to the computer", "A program in execution", "A folder containing saved files", "A type of graphical user interface"], "ans": 1, "exp": "Slide 8 defines a process directly as: A process is a program in execution."}, {"q": "Which key function ensures that processes sharing resources do not conflict?", "options": ["Process Creation and Termination", "Process Scheduling", "Process Synchronization", "Storage Allocation"], "ans": 2, "exp": "Process Synchronization ensures processes that share resources don't conflict."}]}, {"id": "u8p2", "subtitle": "Web Browser Process Lifecycle Example", "page": "8", "en": "Example: When you open a web browser, the OS creates a process for it, allocates CPU and memory, and manages its execution. If you open multiple programs, the OS schedules CPU time for each, allowing all of them to run simultaneously. When you close the browser, the OS terminates its process and frees the resources.", "ar": "مثال: عندما تفتح متصفح ويب، ينشئ نظام التشغيل عملية له، ويخصص لها المعالج والذاكرة، ويدير تنفيذها. وإذا فتحت عدة برامج، يجدول نظام التشغيل وقت المعالج لكل منها مما يسمح لها جميعاً بالعمل بالتزامن. وعند إغلاق المتصفح، ينهي نظام التشغيل عمليته ويحرر الموارد.", "mcqs": [{"q": "What happens when you close a web browser according to the Process Management example?", "options": ["The OS keeps its process running forever", "The OS terminates its process and frees the resources", "The OS uninstalls the browser driver", "The OS switches from GUI to CLI"], "ans": 1, "exp": "When you close the browser, the OS terminates its process and frees the resources."}]}]}, {"id": 9, "title": "Device Drivers", "arTitle": "مشغلات الأجهزة (التعريفات)", "pages": "9", "category": "إدارة الموارد", "paragraphs": [{"id": "u9p1", "subtitle": "Definition & Importance of Device Drivers", "page": "9", "en": "A device driver is a small software program that allows the operating system to communicate with hardware devices. Why They Are Important: The OS cannot directly control hardware; it needs drivers to translate commands. Without the correct driver, the hardware will not function properly or may not work at all.", "ar": "مشغل الجهاز (Device Driver) هو برنامج صغير يسمح لنظام التشغيل بالتواصل مع الأجهزة المادية. لماذا هي مهمة: لا يستطيع نظام التشغيل التحكم بالعتاد مباشرة، بل يحتاج إلى المشغلات لترجمة الأوامر. وبدون المشغل الصحيح، لن يعمل الجهاز بشكل سليم أو قد لا يعمل إطلاقاً.", "mcqs": [{"q": "Why does the operating system need device drivers?", "options": ["Because the OS cannot directly control hardware and needs drivers to translate commands", "Because drivers replace physical RAM", "Because drivers organize files into folders", "Because drivers provide a graphical user interface"], "ans": 0, "exp": "Slide 9 states that the OS cannot directly control hardware and needs drivers to translate commands."}]}, {"id": "u9p2", "subtitle": "Examples of Device Drivers", "page": "9", "en": "Examples: A printer driver allows Windows or macOS to send documents to a specific printer model. A Wi-Fi driver enables the computer to connect to wireless networks.", "ar": "أمثلة: يسمح مشغل الطابعة (Printer Driver) لنظام Windows أو macOS بإرسال المستندات إلى طراز طابعة محدد. كما يمكّن مشغل الواي فاي (Wi-Fi Driver) الحاسوب من الاتصال بالشبكات اللاسلكية.", "mcqs": [{"q": "What does a Wi-Fi driver enable a computer to do?", "options": ["Send documents to a specific printer model", "Connect to wireless networks", "Run multiple operating systems via dual-boot", "Scroll horizontally through documents"], "ans": 1, "exp": "Slide 9 states: A Wi-Fi driver enables the computer to connect to wireless networks."}]}]}, {"id": 10, "title": "Basics of Common Operating Systems", "arTitle": "أساسيات أنظمة التشغيل الشائعة", "pages": "10", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u10p1", "subtitle": "Dominant Platforms & Visual Comparison Table", "page": "10", "en": "Operating systems such as Microsoft Windows, Apple macOS, Linux distributions, and Chrome OS are the dominant platforms in personal computing.", "ar": "تُعد أنظمة التشغيل مثل Microsoft Windows، وApple macOS، وتوزيعات Linux، وChrome OS المنصات المهيمنة في مجال الحوسبة الشخصية.", "table": {"caption": "Operating Systems Comparison Chart (Extracted from Slide 10)", "headers": ["Operating System Name", "Developed By", "Available On"], "rows": [["Windows", "Microsoft", "Laptops, tablets, desktops, all-in-ones, smartphones"], ["macOS", "Apple", "Laptops, desktops, all-in-ones"], ["iOS", "Apple", "Tablets, iPhones, iPod touches"], ["Android", "Google", "Smartphones, tablets"], ["Linux", "Open source", "Laptops, desktops, tablets"], ["Chrome OS", "Google", "Chromebooks"]]}, "mcqs": [{"q": "According to the Slide 10 comparison chart, which operating systems are developed by Google?", "options": ["Windows and Linux", "Android and Chrome OS", "macOS and iOS", "Linux and Chrome OS"], "ans": 1, "exp": "In the Slide 10 chart, both Android and Chrome OS are listed under Developed By: Google."}, {"q": "According to the Slide 10 chart, what devices is Chrome OS available on?", "options": ["Chromebooks", "iPhones and iPod touches", "All-in-ones and smartphones", "Industrial controllers"], "ans": 0, "exp": "The Slide 10 comparison chart lists Chrome OS as Available On: Chromebooks."}]}]}, {"id": 11, "title": "Desktop and Laptop Operating Systems", "arTitle": "أنظمة تشغيل سطح المكتب والحواسيب المحمولة", "pages": "11", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u11p1", "subtitle": "Classification of Operating Systems", "page": "11", "en": "Types of Operating Systems: Operating systems can be classified based on their use and device type. Category A covers Desktop and Laptop OS, including Microsoft Windows, macOS, Linux, and ChromeOS.", "ar": "أنواع أنظمة التشغيل: يمكن تصنيف أنظمة التشغيل بناءً على استخدامها ونوع الجهاز. وتشمل الفئة (A) أنظمة تشغيل الحواسيب المكتبية والمحمولة، ومنها Microsoft Windows وmacOS وLinux وChromeOS.", "mcqs": [{"q": "On what two criteria can operating systems be classified according to Slide 11?", "options": ["Their use and device type", "Their screen size and battery life", "Their font style and icon colors", "Their mouse buttons and scroll wheel"], "ans": 0, "exp": "Slide 11 states: Operating systems can be classified based on their use and device type."}]}]}, {"id": 12, "title": "Microsoft Windows", "arTitle": "نظام مايكروسوفت ويندوز", "pages": "11", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u12p1", "subtitle": "Market Share & Key Characteristics of Windows", "page": "11", "en": "Microsoft Windows — Market Share: The dominant leader in the global desktop market. Key Characteristics: User-Friendly GUI: Known for its familiar graphical user interface (Start Menu, Taskbar). Wide Software Compatibility: The largest library of commercial software, especially for gaming and business applications. Hardware Variety: Runs on a vast array of hardware from numerous manufacturers (Dell, HP, Lenovo, etc.). Common Versions: Windows 10, Windows 11.", "ar": "نظام مايكروسوفت ويندوز — الحصة السوقية: القائد المهيمن في سوق الحواسيب المكتبية العالمي. الخصائص الرئيسية: واجهة رسومية سهلة الاستخدام (GUI): معروف بواجهته المألوفة (قائمة ابدأ، شريط المهام). توافق برمجي واسع: يمتلك أكبر مكتبة للبرمجيات التجارية، لا سيما للألعاب وتطبيقات الأعمال. تنوع العتاد: يعمل على مجموعة واسعة من الأجهزة من شركات مصنعة عديدة (مثل Dell وHP وLenovo وغيرها). الإصدارات الشائعة: Windows 10 وWindows 11.", "mcqs": [{"q": "Which characteristic makes Microsoft Windows especially strong for gaming and business applications?", "options": ["Exclusive to Apple hardware", "Wide Software Compatibility with the largest library of commercial software", "Walled Garden App Store", "Web-based cloud-only applications"], "ans": 1, "exp": "Slide 11 highlights Windows' Wide Software Compatibility: the largest library of commercial software, especially for gaming and business applications."}, {"q": "Which versions of Microsoft Windows are listed as common versions in the lecture?", "options": ["Windows 7 and Windows 8", "Windows 10 and Windows 11", "Windows XP and Windows Vista", "Windows Sonoma and Windows Ventura"], "ans": 1, "exp": "Slide 11 lists Common Versions: Windows 10, Windows 11."}]}]}, {"id": 13, "title": "macOS", "arTitle": "نظام ماك أو إس (macOS)", "pages": "12", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u13p1", "subtitle": "Market Share & Key Characteristics of macOS", "page": "12", "en": "macOS — Market Share: The second most popular desktop OS. Key Characteristics: Exclusive to Apple Hardware: Only runs on Apple's Mac computers (iMac, MacBook, Mac Pro). User Experience: Renowned for its sleek, intuitive, and polished user interface. Ecosystem Integration: Seamlessly integrates with other Apple devices like iPhone, iPad, and Apple Watch. Stability & Security: Generally considered less vulnerable to malware than Windows. Common Versions: macOS Sonoma, macOS Ventura.", "ar": "نظام macOS — الحصة السوقية: ثاني أكثر أنظمة سطح المكتب شعبية. الخصائص الرئيسية: حصري لأجهزة Apple: يعمل فقط على حواسيب Mac من Apple (مثل iMac وMacBook وMac Pro). تجربة المستخدم: يشتهر بواجهة مستخدم أنيقة وبديهية ومصقولة. تكامل المنظومة: يتكامل بسلاسة مع أجهزة Apple الأخرى مثل iPhone وiPad وApple Watch. الاستقرار والأمان: يُعد عموماً أقل عرضة للبرمجيات الخبيثة من Windows. الإصدارات الشائعة: macOS Sonoma وmacOS Ventura.", "mcqs": [{"q": "Which statement accurately describes macOS hardware compatibility?", "options": ["It runs on a vast array of Dell, HP, and Lenovo laptops", "It is exclusive to Apple's Mac computers (iMac, MacBook, Mac Pro)", "It is designed specifically for Chromebooks", "It is open-source and runs on any smartphone"], "ans": 1, "exp": "Slide 12 states macOS is Exclusive to Apple Hardware and only runs on Apple's Mac computers (iMac, MacBook, Mac Pro)."}, {"q": "Which common versions of macOS are mentioned in Slide 12?", "options": ["macOS Sonoma and macOS Ventura", "macOS 10 and macOS 11", "macOS Server and macOS RTOS", "macOS Chrome and macOS Pixel"], "ans": 0, "exp": "Slide 12 lists Common Versions: macOS Sonoma, macOS Ventura."}]}]}, {"id": 14, "title": "Linux", "arTitle": "نظام لينكس (Linux)", "pages": "13", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u14p1", "subtitle": "Key Characteristics of Linux", "page": "13", "en": "Linux — Key Characteristics: Open-Source: The core code is free to use, modify, and distribute. Distributions: Comes in many different \"flavors\" or distributions, each with its own focus (e.g., user-friendliness, performance, server use). Customizability & Control: Highly customizable and favored by developers, system administrators, and tech enthusiasts.", "ar": "نظام لينكس (Linux) — الخصائص الرئيسية: مفتوح المصدر (Open-Source): الكود الأساسي مجاني للاستخدام والتعديل والتوزيع. التوزيعات (Distributions): يأتي بعدة «نكهات» أو توزيعات مختلفة، لكل منها تركيزها الخاص (مثل سهولة الاستخدام، الأداء، أو استخدام الخوادم). قابلية التخصيص والتحكم: قابل للتخصيص بدرجة عالية ومفضل لدى المطورين ومديري الأنظمة وشغوفي التقنية.", "mcqs": [{"q": "What does 'Open-Source' mean in the context of Linux?", "options": ["It only runs on Apple computers", "The core code is free to use, modify, and distribute", "All files must be stored in Google Drive", "It has a tightly controlled App Store"], "ans": 1, "exp": "Slide 13 defines Open-Source as: The core code is free to use, modify, and distribute."}, {"q": "Who primarily favors Linux for its high customizability and control?", "options": ["Developers, system administrators, and tech enthusiasts", "Only smartphone gamers", "Only Chromebook users", "Only iPod touch users"], "ans": 0, "exp": "Slide 13 notes Linux is favored by developers, system administrators, and tech enthusiasts."}]}]}, {"id": 15, "title": "ChromeOS", "arTitle": "نظام كروم أو إس (ChromeOS)", "pages": "14", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u15p1", "subtitle": "Web-Based Architecture & Hardware Specificity", "page": "14", "en": "Google Chrome OS is a web-based operating system. With Chrome OS, Applications are primarily web apps, and files are stored in the cloud (like Google Drive). Hardware Specific: It is designed specifically for a class of devices called Chromebooks, which are produced by partners like Acer, ASUS, Dell, Lenovo, and Google itself (Pixelbook).", "ar": "نظام Google Chrome OS هو نظام تشغيل قائم على الويب؛ حيث تكون التطبيقات فيه أساساً تطبيقات ويب وتُخزّن الملفات في السحابة (مثل Google Drive). مخصص لعتاد محدد: صُمم خصيصاً لفئة من الأجهزة تُسمى أجهزة كروم بوك (Chromebooks)، تنتجها شركات شريكة مثل Acer وASUS وDell وLenovo وشركة Google نفسها (Pixelbook).", "mcqs": [{"q": "Where are files primarily stored when using Google Chrome OS?", "options": ["In the cloud (like Google Drive)", "Only on external printer queues", "Exclusively in Apple AirDrop", "Only in physical RAM"], "ans": 0, "exp": "Slide 14 states that with Chrome OS, applications are primarily web apps and files are stored in the cloud (like Google Drive)."}]}, {"id": "u15p2", "subtitle": "Critical Distinction: OS vs. Application", "page": "14", "en": "OS vs. Application: This is a critical distinction. Chrome OS is the entire operating system that powers the computer. The Chrome Browser is a single application that can be installed on other operating systems like Windows, macOS, and Linux.", "ar": "نظام التشغيل مقابل التطبيق: هذا تمييز جوهري. فنظام Chrome OS هو نظام التشغيل الكامل الذي يشغّل الحاسوب، أما متصفح Chrome Browser فهو تطبيق واحد يمكن تثبيته على أنظمة تشغيل أخرى مثل Windows وmacOS وLinux.", "mcqs": [{"q": "What is the critical distinction between Chrome OS and the Chrome Browser?", "options": ["Chrome OS is a single web app, while Chrome Browser powers the entire computer", "Chrome OS is the entire operating system powering the computer, whereas Chrome Browser is a single application installable on Windows, macOS, and Linux", "Chrome Browser only works on Chromebooks", "There is no difference between them"], "ans": 1, "exp": "Slide 14 emphasizes that Chrome OS is the entire operating system powering the computer, while Chrome Browser is a single application installable on other OSs."}]}]}, {"id": 16, "title": "Mobile Operating Systems", "arTitle": "أنظمة تشغيل الأجهزة المحمولة", "pages": "15", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u16p1", "subtitle": "B. Mobile Operating Systems Overview", "page": "15", "en": "Mobile Operating Systems power smartphones and tablets. The two major mobile operating systems covered are Android and iOS.", "ar": "تشغّل أنظمة تشغيل الأجهزة المحمولة الهواتف الذكية والأجهزة اللوحية، ومن أبرزها نظاما Android وiOS.", "mcqs": [{"q": "Which types of devices are powered by Mobile Operating Systems?", "options": ["Supercomputers and industrial controllers", "Smartphones and tablets", "Desktops and servers only", "Printers and keyboards"], "ans": 1, "exp": "Slide 15 states: Mobile Operating Systems — These power smartphones and tablets."}]}]}, {"id": 17, "title": "Android", "arTitle": "نظام أندرويد (Android)", "pages": "15", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u17p1", "subtitle": "Market Share & Key Characteristics of Android", "page": "15", "en": "Android — Market Share: The most popular mobile OS. Key Characteristics: Open-Source: The Android Open Source Project allows manufacturers to customize the OS. Hardware Diversity: Runs on devices from many companies (Samsung, Google, OnePlus, Xiaomi, etc.). Google Ecosystem: Deeply integrated with Google services (Gmail, Maps, Play Store). Customizability: Offers a high degree of customization for users.", "ar": "نظام أندرويد (Android) — الحصة السوقية: نظام التشغيل الأكثر شعبية للهواتف المحمولة. الخصائص الرئيسية: مفتوح المصدر: يتيح مشروع Android مفتوح المصدر للشركات المصنعة تخصيص النظام. تنوع العتاد: يعمل على أجهزة من شركات عديدة (مثل Samsung وGoogle وOnePlus وXiaomi وغيرها). منظومة Google: متكامل بعمق مع خدمات Google (مثل Gmail والخرائط ومتجر Play Store). قابلية التخصيص: يوفر درجة عالية من التخصيص للمستخدمين.", "mcqs": [{"q": "Which of the following is a key characteristic of Android?", "options": ["Exclusive to Apple hardware", "Most popular mobile OS with hardware diversity across Samsung, Google, OnePlus, and Xiaomi", "Closed-source with no customization allowed", "Designed only for Chromebooks"], "ans": 1, "exp": "Slide 15 lists Android as the most popular mobile OS with Open-Source customization and Hardware Diversity across many manufacturers."}]}]}, {"id": 18, "title": "iOS", "arTitle": "نظام آي أو إس (iOS)", "pages": "16", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u18p1", "subtitle": "Market Share & Key Characteristics of iOS", "page": "16", "en": "iOS — Market Share: The second major mobile OS. Key Characteristics: Exclusive to Apple Hardware: Only runs on iPhones and iPads. Walled Garden: A tightly controlled App Store ensures app quality and security, but limits user freedom compared to Android. User Experience: Known for its smooth performance, intuitive interface, and cohesive design. Ecosystem Integration: Works flawlessly with other Apple devices and services (Mac, Apple Watch, AirDrop).", "ar": "نظام iOS — الحصة السوقية: ثاني أكبر نظام تشغيل للهواتف المحمولة. الخصائص الرئيسية: حصري لأجهزة Apple: يعمل فقط على هواتف iPhone وأجهزة iPad. الحديقة المسوّرة (Walled Garden): يضمن متجر التطبيقات (App Store) الخاضع لرقابة صارمة جودة التطبيقات وأمانها، لكنه يحد من حرية المستخدم مقارنة بنظام Android. تجربة المستخدم: يُعرف بأدائه السلس وواجهته البديهية وتصميمه المتماسك. تكامل المنظومة: يعمل بسلاسة تامة مع أجهزة وخدمات Apple الأخرى (مثل Mac وApple Watch وAirDrop).", "mcqs": [{"q": "What does the term 'Walled Garden' describe in iOS?", "options": ["An open-source system customizable by any manufacturer", "A tightly controlled App Store that ensures app quality and security but limits user freedom compared to Android", "A feature that lets iOS run on Samsung devices", "A command-line interface for servers"], "ans": 1, "exp": "Slide 16 defines Walled Garden as a tightly controlled App Store that ensures app quality and security, but limits user freedom compared to Android."}]}]}, {"id": 19, "title": "Server Operating Systems", "arTitle": "أنظمة تشغيل الخوادم", "pages": "17", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u19p1", "subtitle": "C. Server Operating Systems", "page": "17", "en": "Server Operating Systems run on powerful computers that provide services (websites, databases, files) to other computers over a network. Examples: Windows Server and Linux Server. They manage large networks, databases, and web services.", "ar": "تعمل أنظمة تشغيل الخوادم على حواسيب قوية تقدم خدمات (مثل مواقع الويب وقواعد البيانات والملفات) لحواسيب أخرى عبر الشبكة. أمثلة: Windows Server وLinux Server. وهي تدير الشبكات الكبيرة وقواعد البيانات وخدمات الويب.", "mcqs": [{"q": "What is the primary function of Server Operating Systems such as Windows Server and Linux Server?", "options": ["Running on powerful computers to provide services (websites, databases, files) over a network", "Operating car airbags in real time", "Powering iPhones and iPads", "Providing mouse hover tooltips"], "ans": 0, "exp": "Slide 17 explains that Server Operating Systems run on powerful computers providing websites, databases, and files over a network."}]}]}, {"id": 20, "title": "Other / Embedded Operating Systems", "arTitle": "أنظمة التشغيل الأخرى والمدمجة (RTOS)", "pages": "17", "category": "أنظمة التشغيل الشائعة", "paragraphs": [{"id": "u20p1", "subtitle": "D. Embedded & Real-Time Operating Systems (RTOS)", "page": "17", "en": "Other / Embedded Operating Systems are lightweight operating systems designed for specific devices. Real-Time Operating Systems (RTOS) are used in time-critical systems like car airbags, medical devices, and industrial controllers.", "ar": "أنظمة التشغيل الأخرى / المدمجة هي أنظمة تشغيل خفيفة الوزن مصممة لأجهزة محددة. أما أنظمة التشغيل بالوقت الحقيقي (RTOS) فتُستخدم في الأنظمة الحرجة زمنياً مثل الوسائد الهوائية في السيارات، والأجهزة الطبية، ووحدات التحكم الصناعية.", "mcqs": [{"q": "Where are Real-Time Operating Systems (RTOS) used according to the lecture?", "options": ["In time-critical systems like car airbags, medical devices, and industrial controllers", "Only in web browsers and Chromebooks", "Exclusively for editing Word documents", "Only on desktop gaming PCs"], "ans": 0, "exp": "Slide 17 specifies that RTOS are used in time-critical systems like car airbags, medical devices, and industrial controllers."}]}]}, {"id": 21, "title": "Choosing Operating Systems", "arTitle": "اختيار أنظمة التشغيل وتشغيل أنظمة متعددة", "pages": "18", "category": "اختيار النظام", "paragraphs": [{"id": "u21p1", "subtitle": "Running Multiple Operating Systems", "page": "18", "en": "You can run or test programs on more than one operating system. You might want to do this to: Test software across different platforms; Use an application that is available only on a specific OS; Access development tools that perform differently on different systems.", "ar": "يمكنك تشغيل أو اختبار البرامج على أكثر من نظام تشغيل. وقد ترغب في ذلك لـ: اختبار البرمجيات عبر منصات مختلفة؛ استخدام تطبيق متاح على نظام تشغيل محدد فقط؛ والوصول إلى أدوات تطوير يختلف أداؤها من نظام لآخر.", "mcqs": [{"q": "Which of the following is a reason to run more than one operating system?", "options": ["To test software across different platforms or use an OS-specific application", "To eliminate the need for any device drivers", "To convert physical RAM into a printer queue", "To disable the graphical user interface permanently"], "ans": 0, "exp": "Slide 18 lists three reasons: testing software across platforms, using an OS-specific application, and accessing development tools."}]}, {"id": "u21p2", "subtitle": "Hardware Support, Virtualization, Dual-Boot & Selection Factors", "page": "18", "en": "Windows and Linux can run on most modern hardware. Although macOS and iOS run only on Apple devices, Apple hardware can still support Windows and Linux through virtualization or dual-boot configurations. Ultimately, selecting an operating system often comes down to price, hardware compatibility, and personal preference.", "ar": "يمكن لنظامي Windows وLinux العمل على معظم الأجهزة الحديثة. وعلى الرغم من أن macOS وiOS يعملان فقط على أجهزة Apple، إلا أن أجهزة Apple لا تزال قادرة على دعم Windows وLinux من خلال المحاكاة الافتراضية (Virtualization) أو إعدادات الإقلاع المزدوج (Dual-Boot). وفي نهاية المطاف، غالباً ما يعتمد اختيار نظام التشغيل على السعر، وتوافق العتاد، والتفضيل الشخصي.", "mcqs": [{"q": "How can Apple hardware support Windows and Linux?", "options": ["Through virtualization or dual-boot configurations", "By replacing the mouse scroll wheel", "By uninstalling the User Interface", "Apple hardware can never run Windows or Linux"], "ans": 0, "exp": "Slide 18 states that Apple hardware can support Windows and Linux through virtualization or dual-boot configurations."}, {"q": "What three factors does selecting an operating system ultimately come down to?", "options": ["Price, hardware compatibility, and personal preference", "Font size, mouse color, and printer speed", "Caching, scheduling, and synchronization", "Hovering, scrolling, and double-clicking"], "ans": 0, "exp": "Slide 18 concludes: selecting an operating system often comes down to price, hardware compatibility, and personal preference."}]}]}, {"id": 22, "title": "The User Interface (UI)", "arTitle": "واجهة المستخدم (UI)", "pages": "19–20", "category": "واجهات المستخدم", "paragraphs": [{"id": "u22p1", "subtitle": "Historical Evolution of User Interfaces", "page": "19", "en": "The operating system provides the user interface (UI) you use to interact with your device. Early computers used command-driven interfaces like MS-DOS, where users had to type exact commands; this was powerful but difficult for most people. Later, menu-driven interfaces appeared, allowing users to choose commands from on-screen menus instead of typing them; these were easier but still not very intuitive. Modern operating systems such as Windows and macOS use a Graphical User Interface (GUI), which displays icons, windows, and buttons and uses point-and-click actions, making computers far more user-friendly.", "ar": "يوفر نظام التشغيل واجهة المستخدم (UI) التي تتفاعل من خلالها مع جهازك. استخدمت الحواسيب المبكرة واجهات معتمدة على الأوامر مثل MS-DOS، حيث كان على المستخدمين كتابة أوامر دقيقة، وكانت قوية لكنها صعبة لمعظم الناس. ولاحقاً ظهرت الواجهات المعتمدة على القوائم التي تتيح اختيار الأوامر من قوائم على الشاشة بدلاً من كتابتها، وكانت أسهل لكنها لم تكن بديهية جداً. أما أنظمة التشغيل الحديثة مثل Windows وmacOS فتستخدم واجهة المستخدم الرسومية (GUI) التي تعرض الأيقونات والنوافذ والأزرار وتعتمد على التأشير والنقر، مما جعل الحواسيب أسهل استخداماً بكثير.", "mcqs": [{"q": "What is the historical progression of user interfaces described on Slide 19?", "options": ["GUI → Menu-driven → Command-driven", "Command-driven (e.g., MS-DOS) → Menu-driven → Graphical User Interface (GUI)", "Menu-driven → GUI → MS-DOS", "Touchpad → CLI → RTOS"], "ans": 1, "exp": "Slide 19 traces the evolution from command-driven interfaces (like MS-DOS) to menu-driven interfaces, and then to modern GUIs."}]}, {"id": "u22p2", "subtitle": "Definition of UI & Its Two Primary Types", "page": "20", "en": "The User Interface (UI) is the component of an OS that allows users to interact with the computer and its programs. Without a UI, users would not be able to give commands or access applications easily. There are two primary types of user interfaces that users encounter: the Graphical User Interface (GUI) and the Command Line Interface (CLI). Each offers a different way to control and manage a computer's functions.", "ar": "واجهة المستخدم (UI) هي المكون في نظام التشغيل الذي يتيح للمستخدمين التفاعل مع الحاسوب وبرامجه؛ وبدونها لن يتمكن المستخدمون من إعطاء الأوامر أو الوصول إلى التطبيقات بسهولة. وهناك نوعان رئيسيان من واجهات المستخدم هما: واجهة المستخدم الرسومية (GUI) وواجهة سطر الأوامر (CLI)، ويقدم كل منهما طريقة مختلفة للتحكم في وظائف الحاسوب وإدارتها.", "mcqs": [{"q": "What are the two primary types of user interfaces encountered by users?", "options": ["Virtual Memory and Caching", "Graphical User Interface (GUI) and Command Line Interface (CLI)", "Dual-Boot and Virtualization", "Windows Server and Linux Server"], "ans": 1, "exp": "Slide 20 states the two primary types of user interfaces are the Graphical User Interface (GUI) and the Command Line Interface (CLI)."}]}]}, {"id": 23, "title": "Graphical User Interface (GUI)", "arTitle": "واجهة المستخدم الرسومية (GUI)", "pages": "21", "category": "واجهات المستخدم", "paragraphs": [{"id": "u23p1", "subtitle": "A. GUI Definition, Interaction & Learning Curve", "page": "21", "en": "A GUI is a visual way of interacting with a computer. Instead of typing commands, you use icons, buttons, menus, and windows to control the system. Interaction: Use a mouse, touchpad, or finger to point, click, drag, and drop. Learning Curve: Easy to learn because visual cues like a trash can icon representing deletion help users understand functions quickly.", "ar": "واجهة المستخدم الرسومية (GUI) هي طريقة بصرية للتفاعل مع الحاسوب؛ فبدلاً من كتابة الأوامر، تستخدم الأيقونات والأزرار والقوائم والنوافذ للتحكم بالنظام. التفاعل: استخدام الفأرة أو لوحة اللمس أو الإصبع للتأشير والنقر والسحب والإفلات. منحنى التعلم: سهلة التعلم لأن الدلائل البصرية مثل أيقونة سلة المهملات التي ترمز إلى الحذف تساعد المستخدمين على فهم الوظائف بسرعة.", "mcqs": [{"q": "Why does a GUI have an easy learning curve?", "options": ["Because users memorize command syntax", "Because visual cues like a trash can icon representing deletion help users understand functions quickly", "Because it requires no processing power for graphics", "Because it only uses the keyboard"], "ans": 1, "exp": "Slide 21 explains that a GUI is easy to learn because visual cues (like a trash can icon for deletion) help users understand functions quickly."}]}, {"id": "u23p2", "subtitle": "GUI Experience & Downside", "page": "21", "en": "Experience: A GUI makes using the computer feel visual and easy. When you click something, you instantly see feedback such as animations, progress bars, or windows opening and closing. Your files and apps are displayed as icons and folders, so you can find and manage them quickly. Downside: Can be slow for complex tasks and resource-heavy, requiring significant processing power for graphics.", "ar": "التجربة: تجعل واجهة GUI استخدام الحاسوب مرئياً وسهلاً؛ فعند النقر على شيء ما، ترى فوراً تغذية راجعة مثل الرسوم المتحركة أو أشرطة التقدم أو فتح النوافذ وإغلاقها، وتُعرض ملفاتك وتطبيقاتك كأيقونات ومجلدات لتجدها وتديرها بسرعة. الجانب السلبي: قد تكون بطيئة للمهام المعقدة ومستهلكة للموارد، إذ تتطلب قدرة معالجة كبيرة للرسوميات.", "mcqs": [{"q": "What is the main downside of a Graphical User Interface (GUI)?", "options": ["It has no visual feedback when clicking", "It can be slow for complex tasks and resource-heavy, requiring significant processing power for graphics", "It cannot display folders or icons", "It forces users to type ipconfig for every action"], "ans": 1, "exp": "Slide 21 lists the downside of GUI: Can be slow for complex tasks and resource-heavy, requiring significant processing power for graphics."}]}]}, {"id": 24, "title": "Command-Line Interface (CLI)", "arTitle": "واجهة سطر الأوامر (CLI)", "pages": "22", "category": "واجهات المستخدم", "paragraphs": [{"id": "u24p1", "subtitle": "B. CLI Definition, Interaction, Learning Curve, Experience & Downside", "page": "22", "en": "A CLI lets you interact with the OS by typing text commands instead of using visuals. Interaction: Type commands using a keyboard (e.g., mkdir, rm, ipconfig). Learning Curve: Steeper than GUI; you must remember commands and syntax. Experience: Very powerful and fast for advanced tasks, automation, and system administration. Downside: Not visually intuitive; errors can happen easily if a command is mistyped, and it can be intimidating for beginners.", "ar": "تتيح لك واجهة سطر الأوامر (CLI) التفاعل مع نظام التشغيل عن طريق كتابة أوامر نصية بدلاً من استخدام العناصر المرئية. التفاعل: كتابة الأوامر باستخدام لوحة المفاتيح (مثل mkdir وrm وipconfig). منحنى التعلم: أكثر صعوبة من GUI، إذ يجب تذكر الأوامر وصياغتها. التجربة: قوية وسريعة جداً للمهام المتقدمة والأتمتة وإدارة الأنظمة. الجانب السلبي: غير بديهية بصرياً؛ وقد تحدث الأخطاء بسهولة عند كتابة أمر بشكل خاطئ، وقد تبدو مُرهِبة للمبتدئين.", "mcqs": [{"q": "Which commands are given as examples of CLI keyboard interaction in Slide 22?", "options": ["mkdir, rm, ipconfig", "Copy, Rename, Delete via right-click", "Start Menu, Taskbar, AirDrop", "Sonoma, Ventura, Pixelbook"], "ans": 0, "exp": "Slide 22 lists (e.g., mkdir, rm, ipconfig) as examples of commands typed using a keyboard in CLI."}, {"q": "Why is a CLI considered intimidating for beginners?", "options": ["It requires too much graphics processing power", "It is not visually intuitive, requires remembering commands and syntax, and errors happen easily if mistyped", "It only runs on Apple hardware", "It cannot automate tasks"], "ans": 1, "exp": "Slide 22 explains CLI has a steeper learning curve, is not visually intuitive, and errors can happen easily if a command is mistyped."}]}]}, {"id": 25, "title": "Which is Better?", "arTitle": "أيهما أفضل: GUI أم CLI؟", "pages": "23", "category": "واجهات المستخدم", "paragraphs": [{"id": "u25p1", "subtitle": "Complementary Roles of GUI and CLI", "page": "23", "en": "Neither is universally \"better.\" They serve different purposes and often complement each other. Use a GUI for everyday tasks: browsing the web, writing documents, and managing personal files — it is user-friendly and visually intuitive. Use a CLI for system administration, software development, automating tasks, or managing remote servers — it is powerful, precise, and efficient. Most modern operating systems provide both; for instance, in Windows, users work with the desktop GUI, while advanced tasks can be done via PowerShell or Command Prompt.", "ar": "ليست أي منهما «أفضل» بشكل مطلق؛ فهما تخدمان أغراضاً مختلفة وغالباً ما تكمل كل منهما الأخرى. استخدم GUI للمهام اليومية: تصفح الويب، كتابة المستندات، وإدارة الملفات الشخصية؛ فهي سهلة الاستخدام وبديهية بصرياً. واستخدم CLI لإدارة الأنظمة، وتطوير البرمجيات، وأتمتة المهام، أو إدارة الخوادم عن بُعد؛ فهي قوية ودقيقة وفعّالة. وتوفر معظم أنظمة التشغيل الحديثة كلتيهما؛ فمثلاً في Windows يعمل المستخدمون عبر واجهة سطح المكتب GUI، بينما يمكن إنجاز المهام المتقدمة عبر PowerShell أو Command Prompt.", "mcqs": [{"q": "Which tools in Windows allow users to perform advanced CLI tasks alongside the desktop GUI?", "options": ["PowerShell or Command Prompt", "AirDrop or Play Store", "Trash Can or Scroll Wheel", "Word or YouTube"], "ans": 0, "exp": "Slide 23 states: In Windows, users work with the desktop GUI, while advanced tasks can be done via PowerShell or Command Prompt."}, {"q": "For which tasks should you use a CLI rather than a GUI?", "options": ["Browsing the web and writing documents", "System administration, software development, automating tasks, or managing remote servers", "Hovering over icons to view tooltips", "Scrolling through long webpages"], "ans": 1, "exp": "Slide 23 recommends CLI for system administration, software development, automating tasks, or managing remote servers."}]}]}, {"id": 26, "title": "Using Mouse Techniques", "arTitle": "استخدام تقنيات الفأرة في نظام التشغيل", "pages": "24", "category": "تقنيات الفأرة", "paragraphs": [{"id": "u26p1", "subtitle": "Role of the Mouse in a GUI", "page": "24", "en": "The mouse is a primary input device in modern operating systems. It allows users to interact with graphical elements in a GUI (Graphical User Interface). Learning proper mouse techniques is essential for efficient navigation and task execution.", "ar": "تُعد الفأرة جهاز إدخال أساسياً في أنظمة التشغيل الحديثة، إذ تتيح للمستخدمين التفاعل مع العناصر الرسومية في واجهة المستخدم الرسومية (GUI). ويُعد تعلم تقنيات الفأرة الصحيحة أمراً ضرورياً للتنقل الفعّال وتنفيذ المهام.", "mcqs": [{"q": "Why is learning proper mouse techniques essential in modern operating systems?", "options": ["For efficient navigation and task execution with graphical elements in a GUI", "For typing CLI syntax without a keyboard", "For increasing physical RAM capacity", "For writing open-source Linux kernels"], "ans": 0, "exp": "Slide 24 states that learning proper mouse techniques is essential for efficient navigation and task execution in a GUI."}]}]}, {"id": 27, "title": "Basic Mouse Components", "arTitle": "المكونات الأساسية للفأرة", "pages": "24", "category": "تقنيات الفأرة", "paragraphs": [{"id": "u27p1", "subtitle": "1. Basic Mouse Components", "page": "24", "en": "Basic Mouse Components consist of three main parts: Left Button usually selects items, opens files, or clicks buttons. Right Button opens context menus with additional options. Scroll Wheel scrolls vertically (and sometimes horizontally) through documents or web pages.", "ar": "تتكون المكونات الأساسية للفأرة من ثلاثة أجزاء رئيسية: الزر الأيسر (Left Button) يحدد العناصر عادةً أو يفتح الملفات أو ينقر الأزرار؛ والزر الأيمن (Right Button) يفتح قوائم السياق التي تحتوي على خيارات إضافية؛ وعجلة التمرير (Scroll Wheel) تمرر عمودياً (وأحياناً أفقياً) عبر المستندات أو صفحات الويب.", "mcqs": [{"q": "What is the primary function of the mouse Right Button?", "options": ["Selecting a range of files", "Opening context menus with additional options", "Scrolling vertically through web pages", "Opening a Word document by single-clicking"], "ans": 1, "exp": "Slide 24 states: Right Button opens context menus with additional options."}]}]}, {"id": 28, "title": "Basic Mouse Actions", "arTitle": "حركات وتقنيات الفأرة الأساسية", "pages": "25–27", "category": "تقنيات الفأرة", "paragraphs": [{"id": "u28p1", "subtitle": "A. Pointing & B. Clicking", "page": "25", "en": "A. Pointing: Move the mouse to position the pointer on a specific icon, button, or menu item (Example: Pointing to a file on the desktop before opening it). B. Clicking: 1. Single Click (Left Button) selects a file, folder, or menu item (Example: Click once on a folder to highlight it). 2. Double Click (Left Button) opens a file, folder, or application (Example: Double-click a Word document to open it). 3. Right Click opens a context menu with options related to the selected item (Example: Right-click a file → \"Copy,\" \"Rename,\" or \"Delete.\").", "ar": "أ. التأشير (Pointing): تحريك الفأرة لوضع المؤشر على أيقونة أو زر أو عنصر قائمة محدد (مثال: التأشير على ملف على سطح المكتب قبل فتحه). ب. النقر (Clicking): 1. النقر المفرد بالزر الأيسر: يحدد ملفاً أو مجلداً أو عنصر قائمة (مثال: النقر مرة واحدة على مجلد لتظليله). 2. النقر المزدوج بالزر الأيسر: يفتح ملفاً أو مجلداً أو تطبيقاً (مثال: النقر المزدوج على مستند Word لفتحه). 3. النقر بالزر الأيمن: يفتح قائمة سياق بخيارات مرتبطة بالعنصر المحدد (مثال: النقر بالزر الأيمن على ملف ← «نسخ» أو «إعادة تسمية» أو «حذف»).", "mcqs": [{"q": "Which mouse action highlights a folder without opening it?", "options": ["Single Click (Left Button)", "Double Click (Left Button)", "Right Click", "Scroll Wheel"], "ans": 0, "exp": "Slide 25 states Single Click (Left Button) selects a file, folder, or menu item (e.g., click once on a folder to highlight it)."}, {"q": "Which options appear in the example of right-clicking a file?", "options": ["\"Copy,\" \"Rename,\" or \"Delete\"", "\"mkdir,\" \"rm,\" or \"ipconfig\"", "\"Start,\" \"Sleep,\" or \"Restart\"", "\"Zoom,\" \"Scroll,\" or \"Tilt\""], "ans": 0, "exp": "Slide 25 gives the example: Right-click a file → 'Copy,' 'Rename,' or 'Delete.'"}]}, {"id": "u28p2", "subtitle": "C. Dragging & Dropping, D. Scrolling, E. Selecting Multiple Items", "page": "26", "en": "C. Dragging and Dropping: Drag means click and hold the left button while moving the pointer; Drop means release the button to place the item in a new location (Example: Moving a file from one folder to another). D. Scrolling: Use the scroll wheel to move up or down a page; in some mice, tilting the wheel scrolls horizontally (Example: Browsing a long webpage or document). E. Selecting Multiple Items: Click + Drag draws a box around multiple icons to select them; Shift + Click selects a range of files in a folder; Ctrl + Click selects multiple non-adjacent files individually.", "ar": "ج. السحب والإفلات (Dragging and Dropping): السحب يعني النقر مع الاستمرار على الزر الأيسر أثناء تحريك المؤشر، والإفلات يعني ترك الزر لوضع العنصر في موقع جديد (مثال: نقل ملف من مجلد إلى آخر). د. التمرير (Scrolling): استخدام عجلة التمرير للتحرك لأعلى أو لأسفل في الصفحة، وفي بعض الفأرات تؤدي إمالة العجلة إلى التمرير أفقياً (مثال: تصفح صفحة ويب أو مستند طويل). هـ. تحديد عدة عناصر: السحب مع النقر (Click + Drag) يرسم مربعاً حول عدة أيقونات لتحديدها؛ و(Shift + Click) يحدد نطاقاً متتالياً من الملفات في مجلد؛ و(Ctrl + Click) يحدد عدة ملفات غير متجاورة بشكل فردي.", "mcqs": [{"q": "Which shortcut selects multiple NON-ADJACENT files individually?", "options": ["Shift + Click", "Ctrl + Click", "Double Click", "Right Click"], "ans": 1, "exp": "Slide 26 specifies: Ctrl + Click selects multiple non-adjacent files individually, whereas Shift + Click selects a range of files."}, {"q": "How do some mice allow horizontal scrolling?", "options": ["By double-clicking the right button", "By tilting the scroll wheel", "By pressing Shift + Drag", "By hovering over the taskbar"], "ans": 1, "exp": "Slide 26 notes: In some mice, tilting the wheel scrolls horizontally."}]}, {"id": "u28p3", "subtitle": "F. Other Techniques & Example Tasks Using Mouse Techniques", "page": "27", "en": "F. Other Techniques: Hovering (pointing at an item without clicking) shows tooltips or previews. Context Menus use right-click for shortcuts to common actions. Double-click vs Single-click: Different systems may allow single-click to open items, so knowing the system convention is important. Example Tasks Using Mouse Techniques: Open a folder → Double-click; Move a file → Click + drag; Rename a file → Right-click → Rename; Select multiple files → Shift + Click or Ctrl + Click; Scroll a webpage → Scroll wheel.", "ar": "و. تقنيات أخرى: التحوم (Hovering) أي التأشير على عنصر دون النقر عليه يظهر التلميحات أو المعاينات؛ وقوائم السياق (Context Menus) تُفتح بالنقر الأيمن لاختصارات الإجراءات الشائعة؛ والنقر المزدوج مقابل النقر المفرد: قد تسمح بعض الأنظمة بفتح العناصر بنقرة واحدة، لذا من المهم معرفة العُرف المتبع في النظام. أمثلة لمهام باستخدام تقنيات الفأرة: فتح مجلد ← نقر مزدوج؛ نقل ملف ← نقر + سحب؛ إعادة تسمية ملف ← نقر بالزر الأيمن ← إعادة تسمية؛ تحديد عدة ملفات ← Shift + Click أو Ctrl + Click؛ تمرير صفحة ويب ← عجلة التمرير.", "mcqs": [{"q": "What happens when you hover over an item (point at it without clicking)?", "options": ["It immediately deletes the item", "It shows tooltips or previews", "It renames the file", "It moves the file to another folder"], "ans": 1, "exp": "Slide 27 defines Hovering as pointing at an item without clicking to show tooltips or previews."}]}]}, {"id": 29, "title": "Summary", "arTitle": "ملخص المحاضرة", "pages": "28", "category": "الختام والمراجع", "paragraphs": [{"id": "u29p1", "subtitle": "Lecture Summary", "page": "28", "en": "The lecture explained the role of operating systems as the essential software that manages computer hardware and software resources. It discussed how the OS handles CPU scheduling, memory allocation, device coordination, storage management, and running processes to keep the system efficient and stable. Major operating systems were compared in terms of features and market presence. The session also clarified the differences between GUI and CLI interfaces and introduced basic mouse techniques to support effective user interaction with a computer.", "ar": "شرحت المحاضرة دور أنظمة التشغيل بوصفها البرنامج الأساسي الذي يدير الموارد المادية والبرمجية للحاسوب، وناقشت كيفية تعامل نظام التشغيل مع جدولة المعالج، وتخصيص الذاكرة، وتنسيق الأجهزة، وإدارة التخزين، والعمليات قيد التشغيل لإبقاء النظام كفؤاً ومستقراً. كما قارنت أنظمة التشغيل الرئيسية من حيث الميزات والحضور السوقي، ووضّحت الفروق بين واجهتي GUI وCLI، وقدّمت تقنيات الفأرة الأساسية لدعم التفاعل الفعّال للمستخدم مع الحاسوب.", "mcqs": [{"q": "According to the Summary, why does the OS handle CPU scheduling, memory allocation, device coordination, storage management, and running processes?", "options": ["To keep the system efficient and stable", "To replace the need for hardware", "To limit users to a single application", "To eliminate all user interfaces"], "ans": 0, "exp": "Slide 28 states the OS handles these functions to keep the system efficient and stable."}]}]}, {"id": 30, "title": "End-of-Session Questions", "arTitle": "أسئلة نهاية المحاضرة", "pages": "29", "category": "الختام والمراجع", "paragraphs": [{"id": "u30p1", "subtitle": "Discussion & Review Questions (Slide 29)", "page": "29", "en": "1. What is an operating system and why is it essential for computer operation? 2. Why might a user choose a command-line interface over a graphical user interface for certain tasks? 3. What factors should a medical student consider when choosing between Windows, macOS, or ChromeOS for their academic needs? 4. Describe three different mouse techniques and explain when each would be used in typical computer operation.", "ar": "1. ما هو نظام التشغيل ولماذا يُعد أساسياً لتشغيل الحاسوب؟ 2. لماذا قد يختار المستخدم واجهة سطر الأوامر (CLI) على واجهة المستخدم الرسومية (GUI) لبعض المهام؟ 3. ما العوامل التي ينبغي لطالب الطب مراعاتها عند الاختيار بين Windows أو macOS أو ChromeOS لاحتياجاته الأكاديمية؟ 4. صِف ثلاث تقنيات مختلفة لاستخدام الفأرة واشرح متى تُستخدم كل منها في التشغيل الاعتيادي للحاسوب.", "mcqs": [{"q": "Based on the lecture, why might a user choose CLI over GUI for certain tasks (End-of-Session Question 2)?", "options": ["Because CLI is powerful, fast, precise, and efficient for advanced tasks, automation, system administration, software development, and managing remote servers", "Because CLI has more visual icons and animations", "Because CLI is easier for complete beginners to guess", "Because CLI uses a scroll wheel and context menus"], "ans": 0, "exp": "Slides 22–23 explain CLI is powerful, fast, precise, and efficient for system administration, software development, automation, and managing remote servers."}]}]}, {"id": 31, "title": "Textbooks", "arTitle": "الكتب المرجعية", "pages": "30", "category": "الختام والمراجع", "paragraphs": [{"id": "u31p1", "subtitle": "Recommended Academic Textbooks", "page": "30", "en": "1. Evans, A., Martin, K., & Poatsy, M. A. (2023). Technology in Action (17th ed.). Pearson. 2. Silberschatz, A., Galvin, P. B., & Gagne, G. (2024). Operating System Concepts (11th ed.). Wiley.", "ar": "1. إيفانز، أ.، مارتن، ك.، وبوتسي، م. أ. (2023). Technology in Action (الطبعة السابعة عشرة). دار نشر بيرسون (Pearson). 2. سيلبرشاتز، أ.، غالفين، ب. ب.، وغاغني، ج. (2024). Operating System Concepts (الطبعة الحادية عشرة). دار نشر وايلي (Wiley).", "mcqs": [{"q": "Which two textbooks are referenced at the end of Lecture 2?", "options": ["Technology in Action (17th ed., Pearson) and Operating System Concepts (11th ed., Wiley)", "Gray's Anatomy and Harrison's Principles of Internal Medicine", "Introduction to Algorithms and Clean Code", "Windows Internals and Linux Bible"], "ans": 0, "exp": "Slide 30 lists Evans et al. (2023) Technology in Action (17th ed., Pearson) and Silberschatz et al. (2024) Operating System Concepts (11th ed., Wiley)."}]}]}], "endQuestions": [{"num": 1, "qEn": "What is an operating system and why is it essential for computer operation?", "qAr": "ما هو نظام التشغيل ولماذا يُعد أساسياً لتشغيل الحاسوب؟", "aEn": "An operating system is the main software that manages all hardware and software on a computer and acts as a bridge between the user, applications, and hardware. It is essential because hardware does not understand human commands directly, and the OS ensures every program receives CPU time, memory space, and storage access without crashing into other programs.", "aAr": "نظام التشغيل هو البرنامج الرئيسي الذي يدير جميع المكونات المادية والبرمجية في الحاسوب ويعمل كجسر بين المستخدم والتطبيقات والعتاد. وهو أساسي لأن العتاد لا يفهم أوامر الإنسان مباشرة، كما يضمن نظام التشغيل حصول كل برنامج على وقت المعالج ومساحة الذاكرة والوصول للتخزين دون تعارض مع البرامج الأخرى."}, {"num": 2, "qEn": "Why might a user choose a command-line interface over a graphical user interface for certain tasks?", "qAr": "لماذا قد يختار المستخدم واجهة سطر الأوامر (CLI) على واجهة المستخدم الرسومية (GUI) لبعض المهام؟", "aEn": "A CLI is very powerful, fast, precise, and efficient for advanced tasks such as system administration, software development, automating tasks, and managing remote servers, whereas a GUI can be slower for complex tasks and resource-heavy due to graphics processing.", "aAr": "لأن واجهة سطر الأوامر (CLI) قوية جداً وسريعة ودقيقة وفعّالة للمهام المتقدمة مثل إدارة الأنظمة وتطوير البرمجيات وأتمتة المهام وإدارة الخوادم عن بُعد، بينما قد تكون واجهة GUI أبطأ للمهام المعقدة وأكثر استهلاكاً لموارد المعالجة الرسومية."}, {"num": 3, "qEn": "What factors should a medical student consider when choosing between Windows, macOS, or ChromeOS for their academic needs?", "qAr": "ما العوامل التي ينبغي لطالب الطب مراعاتها عند الاختيار بين Windows أو macOS أو ChromeOS لاحتياجاته الأكاديمية؟", "aEn": "Based on the lecture, key factors include price, hardware compatibility, and personal preference, alongside software compatibility (Windows has the largest commercial software library and wide hardware variety), ecosystem integration and stability/security (macOS integrates seamlessly with Apple devices and is less vulnerable to malware), and web/cloud dependence (ChromeOS relies primarily on web apps and cloud storage like Google Drive on Chromebooks).", "aAr": "استناداً إلى المحاضرة، تشمل العوامل الأساسية السعر وتوافق العتاد والتفضيل الشخصي، إضافةً إلى التوافق البرمجي (يمتلك Windows أكبر مكتبة برمجيات وتنوعاً في الأجهزة)، وتكامل المنظومة والاستقرار والأمان (يتكامل macOS بسلاسة مع أجهزة Apple وهو أقل عرضة للبرمجيات الخبيثة)، والاعتماد على الويب والسحابة (يعتمد ChromeOS أساساً على تطبيقات الويب والتخزين السحابي مثل Google Drive على أجهزة Chromebooks)."}, {"num": 4, "qEn": "Describe three different mouse techniques and explain when each would be used in typical computer operation.", "qAr": "صِف ثلاث تقنيات مختلفة لاستخدام الفأرة واشرح متى تُستخدم كل منها في التشغيل الاعتيادي للحاسوب.", "aEn": "Examples from the lecture include: (1) Double Click (Left Button) to open a file, folder, or application (e.g., opening a Word document); (2) Dragging and Dropping (click and hold left button, move, then release) to move a file from one folder to another; (3) Right Click to open a context menu with item-specific shortcuts such as Copy, Rename, or Delete (also Scrolling to browse long documents, or Shift+Click / Ctrl+Click to select multiple files).", "aAr": "من الأمثلة الواردة في المحاضرة: (1) النقر المزدوج بالزر الأيسر لفتح ملف أو مجلد أو تطبيق (مثل فتح مستند Word)؛ (2) السحب والإفلات (النقر مع الاستمرار ثم التحريك فالإفلات) لنقل ملف من مجلد إلى آخر؛ (3) النقر بالزر الأيمن لفتح قائمة السياق التي تضم اختصارات مثل النسخ أو إعادة التسمية أو الحذف (إضافة إلى التمرير لتصفح المستندات الطويلة، أو Shift+Click وCtrl+Click لتحديد عدة ملفات)."}], "logos": {"basrah": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAIAAABt+uBvAAA3xElEQVR42u29d5zV1Zn4/5xzPu32O733YRiGXoaOUhQpoqjYe0tMjCYmlk3ZqDExboyboqbZEntBsSEICIjSpMPAMIXpfW4vn3rK748xrm6+SRBNdvf3ynnN675m/phb3ufp5zzPRUII+Nf66wv/C8G/AP0L0D9ySf8b3sSIHRRC/KVBRAj9t8d/8kL/U0ZaCME5H/nYGJ+UIHPOhRDoz+v/n4BGuPw3KJzxUDg0PDQUCoXTaYNzB2NAiBAiZwSDmZmZOXm5fr/v08/DGDt5sv83AI3sPyFk5M9EMnHgwMGdO3bu3bu36XhLf3+/4zi6aQksEQKCMyEQp4JgQgjKzsmqLC8bO65u3ty59fVTq0eN+jRujPE/TqD+GYCEEJwLQjAA2La1bt36l199bdv728KRmNvlra6urhkzpqyqOreg2OX2IYkIpHAOhp62DDMWS0Riofa25t729qGenngkFPBoY8eWnr387JXnraqqqfmzQPGR5/8/Bmhkh0ekprOj4+mnn37qySd7eweq6yacPn/hgoWLRo+p8wczOCa2AN3mnAuXIqUckkyablVO6kY8ZVoAKVOnhpkYGhro7G4+evDoke29zY2azFcsP+PG669bdNYyjLEAIbj40pXuHwhoRPgBYHBw8D8euP/Jp/4oBDlv5aqLLr60btIUrz/AEaQs23EYQ8jgmAvkc8nbN61TfTkTJk9bs/qVitoJgeLKUNqyHJZO6Y5FmcMs00rEQn3tx1r2vd+ydwuLh2edftadd9y6bOmiEdv05WrcPwoQY4wQYlnWo48+es9992JZvemmm6+/9iuFBQWWzW3hMA4UAUWEAzCOKQfK6IbXX96x7lWBtaracUePHR07c8GiK26MJwzimLI3I5y0I0k9bTjpZNpIx5OR4fTwYNvhQ8d3bbaGTyxfMvdHP757ytRpn96bL77IPffc848IajDGBw8cOv/8859/9sXrvnLzb37/2LkrzsEeb1yngABk2RGCImJToJRHLXuISaFQ+sXf/Pqe79+0+f0thsNv+eq1R9v6C2snbl3z0q63nju2532CaEFJuU25S3WDx2OqfqrmKv6K/JIiSZV2b//g5ReeZXZyRn29rGgjovS/DtAnPuXnP/vZqgsvLimvfv6FV6+85gqfO8jsJFVkpBDEhe6wmI0GU6IrJt
